          <div class="stock-row">
            <span>${product.label} ¥${economy.prices[product.id].toFixed(1)}${priceLockHours > 0 ? ` · 锁${Math.ceil(priceLockHours)}h` : ""}</span>
            <span class="stock-bar"><span class="stock-fill" style="width: ${percent}%; background: ${product.color};"></span></span>
            <strong>${stock}</strong>
          </div>
        `;
      }).join("");

      agentList.innerHTML = agents.map((agent) => `
        <div class="agent-row">
          <span class="agent-name"><span class="agent-dot" style="background: ${agent.color};"></span>${agent.role}</span>
          <strong>${agent.state}</strong>
        </div>
      `).join("");

      aiStateValue.textContent = vendingAgent.state;
      aiToggleButton.textContent = vendingAgent.enabled ? "AI 自动" : "AI 暂停";
      aiStrategyButton.textContent = activeStrategy().label;
      llmModeValue.textContent = vendingAgent.llmMode;
      const observation = vendingAgent.observations || {};
      aiObservationGrid.innerHTML = [
        ["客流", observation.traffic ?? 0],
        ["库存风险", observation.stockRisk?.length ? labelsFor(observation.stockRisk) : "无"],
        ["现金", `¥${(observation.cash ?? economy.operatorCash).toFixed(0)}`],
        ["热卖", labelsFor([observation.bestSeller || "water"])],
        ["健康", `${(observation.health ?? economy.health).toFixed(0)}`],
        ["垃圾", Number(observation.trash ?? economy.trash).toFixed(0)],
        ["天气", observation.weather || weatherInfo().label],
        ["节假", observation.holiday || environment.holiday],
        ["学习", observation.learningLabel || environment.lastTrafficLearning],
        ["调价", observation.pricePolicy || priceLockSummary()],
        ["月结", `¥${(observation.supplierPayable ?? economy.supplierPayable).toFixed(0)} / D${economy.nextSupplierSettlementDay}`]
      ].map(([label, value]) => `
        <div class="ai-card">
          <span>${label}</span>
          <strong>${value}</strong>
        </div>
      `).join("");
      aiDecisionList.innerHTML = vendingAgent.decisions.map((decision) => `<li>${decision}</li>`).join("");
      aiReasoningTrace.innerHTML = vendingAgent.reasoningTrace.map((step) => `
        <div class="reasoning-step">
          <strong>${step.label}</strong>
          <span>${step.text}</span>
        </div>
      `).join("");
      slaGrid.innerHTML = [
        ["保障池", `¥${vendingAgent.sla.coveragePool.toFixed(0)}`],
        ["已赔付", `¥${economy.claimsPaid.toFixed(0)}`],
        ["拦截", vendingAgent.sla.blocked],
        ["风险上限", vendingAgent.sla.riskLimit],
        ["贷款上限", `¥${vendingAgent.sla.maxLoan}`],
        ["订单上限", `¥${vendingAgent.sla.maxOrderCost}`],
        ["调价治理", priceLockSummary()],
        ["供货应付", `¥${economy.supplierPayable.toFixed(0)}`]
      ].map(([label, value]) => `
        <div class="sla-card">
          <span>${label}</span>
          <strong>${value}</strong>
        </div>
      `).join("");
      auditHeightValue.textContent = `#${vendingAgent.auditTrail.length}`;
      auditTrailList.innerHTML = vendingAgent.auditTrail.slice(0, 8).map((entry) => `
        <div class="audit-item">
          <strong>${entry.hash}</strong>
          <span>${entry.action} · 风险 ${entry.risk} · ${entry.status}</span>
          <span>${entry.summary}</span>
        </div>
      `).join("");
      dailyReportStatus.textContent = economy.dailyReports[0] ? `D${economy.dailyReports[0].day} 已生成` : "等待午夜";
      dailyReportList.innerHTML = economy.dailyReports.slice(0, 7).map((report) => `
        <div class="report-item">
          <strong>D${report.day} ${report.title}</strong>
          <span>${report.summary}</span>
          <span>${report.risk}</span>
          <span>${report.environmentSummary}</span>
          ${report.learning ? `<span>${report.learning}</span>` : ""}
        </div>
      `).join("");
      aiMemoryList.innerHTML = vendingAgent.memory.map((item) => `<li>${item}</li>`).join("");
    }

    function updateEconomy(delta) {
      if (!economyRunning) return;

      updateEnvironment(delta);

      const machine = vendingPoint();
      economy.restockCooldown = Math.max(0, economy.restockCooldown - delta);
      if (!machine) {
        economy.lastEvent = "经济系统缺少自动贩卖机。";
        agents.forEach((agent) => wanderAgent(agent, delta));
        return;
      }

      updateClosedLoop(delta, machine);
      updateVendingAgent(delta, machine);

      agents.forEach((agent) => {
        if (agent.type === "consumer") {
          updateBuyerAgent(agent, delta, machine);
        } else {
          updateSystemAgent(agent, delta, machine);
        }
      });
    }

    function updateEnvironment(delta) {
      const previousDay = environment.day;
      environment.elapsedHours += delta * environment.timeScale;
      const dayIndex = Math.floor(environment.elapsedHours / 24);
      const hourFloat = environment.elapsedHours % 24;
      environment.day = dayIndex + 1;
      environment.hour = Math.floor(hourFloat);
      environment.minute = Math.floor((hourFloat - environment.hour) * 60);
      environment.weekday = (dayIndex + 1) % 7;
      environment.season = seasonTypes[Math.floor((environment.day - 1) / 7) % seasonTypes.length].id;
      environment.holiday = holidayName(environment.day, environment.weekday);
      environment.weatherTimer -= delta;

      if (environment.weatherTimer <= 0) {
        environment.weather = chooseWeather();
        environment.lastWeatherChange = weatherInfo().label;
        environment.weatherTimer = 18 + Math.random() * 18;
      }

      let profile = environmentProfile();
      if (environment.day !== previousDay) {
        const closedContext = closedDayEnvironmentSummary(previousDay);
        updateSupplierSettlementSchedule(previousDay);
        generateDailyReport(previousDay, closedContext);
        resetDailyPriceGovernance();
        resetDailyEnvironmentStats();
        rollDailyTrafficProfile();
        environment.previousDay = environment.day;
        profile = environmentProfile();
      }

      environment.trafficIndex = profile.trafficIndex;
      environment.demandIndex = profile.demandIndex;
      recordDailyEnvironmentSample(profile, delta);
    }

    function environmentProfile() {
      const weather = weatherInfo();
      const season = seasonInfo();
      const hour = environment.hour;
      const commutePeak = (hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 18);
      const lunchPeak = hour >= 11 && hour <= 13;
      const afterWorkLeisure = hour >= 18 && hour <= 21;
      const nightLow = hour < 6 || hour >= 22;
      const weekend = environment.weekday === 0 || environment.weekday === 6;
      const holidayBoost = environment.holiday !== "工作日" ? 1.45 : 1;
      const weekendTraffic = lunchPeak ? 1.28 : afterWorkLeisure ? 1.24 : 1.15;
      const timeTraffic = nightLow ? 0.22 : weekend ? weekendTraffic : commutePeak ? 1.34 : lunchPeak ? 1.2 : afterWorkLeisure ? 1.18 : 0.86;
      const microTraffic = 1
        + Math.sin(environment.elapsedHours * 2.6 + environment.trafficWave) * 0.08
        + Math.sin(environment.elapsedHours * 5.1 + environment.trafficWave * 0.7) * 0.04;
      const trafficIndex = clamp(timeTraffic * weather.traffic * season.traffic * holidayBoost * environment.dailyTrafficVariance * microTraffic, 0.12, 2.4);
      const demandIndex = clamp((lunchPeak ? 1.18 : 1) * weather.demand * holidayBoost, 0.2, 2.2);
      return { trafficIndex, demandIndex };
    }

    function rollDailyTrafficProfile() {
      environment.dailyTrafficVariance = Number(clamp(0.74 + Math.random() * 0.58, 0.72, 1.34).toFixed(2));
      environment.trafficWave = Math.random() * Math.PI * 2;
      environment.lastTrafficLearning = `D${environment.day} 波动${Math.round(environment.dailyTrafficVariance * 100)}%`;
    }

    function recordDailyEnvironmentSample(profile, delta) {
      const weight = Math.max(0.001, delta * environment.timeScale);
      environment.dailyTrafficSamples += weight;
      environment.dailyTrafficTotal += profile.trafficIndex * weight;
      environment.dailyDemandTotal += profile.demandIndex * weight;
      environment.dailyPeakTraffic = Math.max(environment.dailyPeakTraffic, profile.trafficIndex);
    }

    function resetDailyEnvironmentStats() {
      environment.dailyTrafficSamples = 0;
      environment.dailyTrafficTotal = 0;
      environment.dailyDemandTotal = 0;
      environment.dailyPeakTraffic = 0;
    }

    function closedDayEnvironmentSummary(day) {
      const samples = Math.max(0.001, environment.dailyTrafficSamples);
      const weekday = day % 7;
      return {
        weather: weatherInfo().label,
        season: seasonInfo().label,
        holiday: holidayName(day, weekday),
        avgTraffic: environment.dailyTrafficTotal / samples,
        avgDemand: environment.dailyDemandTotal / samples,
        peakTraffic: environment.dailyPeakTraffic || environment.trafficIndex,
        variance: environment.dailyTrafficVariance
      };
    }

    function isBusinessOpen(kind) {
      const schedule = socialSchedules[kind];
      if (!schedule) return true;
      if ((kind === "office" || kind === "bank" || kind === "school") && (environment.weekday === 0 || environment.weekday === 6)) {
        return false;
      }
      const hour = environment.hour + environment.minute / 60;
      return hour >= schedule.open && hour < schedule.close;
    }

    function serviceAvailability(kind) {
      if (kind === "banker") return isBusinessOpen("bank") ? 1 : 0.08;
      if (kind === "supplier") return isBusinessOpen("supplier") ? 1 : 0.12;
      if (kind === "logistics") return isBusinessOpen("logistics") ? 1 : 0.35;
      if (kind === "employer") return isBusinessOpen("office") ? 1 : 0.12;
      return 1;
    }

    function trafficSegment() {
      const hour = environment.hour + environment.minute / 60;
      const weekend = environment.weekday === 0 || environment.weekday === 6 || environment.holiday !== "工作日";
      if (weekend) return "weekend";
      if (hour < 6 || hour >= 22) return "night";
      if ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 18.5)) return "commute";
      if (hour >= 11 && hour <= 13.5) return "lunch";
      if (hour >= 18.5 && hour <= 21) return "afterWork";
      if (isBusinessOpen("office")) return "workday";
      return "leisure";
    }

    function trafficSegmentLabel(segment = trafficSegment()) {
      const labels = {
        commute: "通勤",
        workday: "上班",
        lunch: "午间",
        afterWork: "下班后",
        leisure: "休闲",
        night: "夜间",
        weekend: "节假"
      };
      return labels[segment] || "客流";
    }

    function snapshotEconomy(state = economy, auditCount = vendingAgent.auditTrail.length, slaBlocked = vendingAgent.sla.blocked) {
      return {
        revenue: state.revenue,
        costs: state.costs,
        sales: state.sales,
        missedSales: state.missedSales,
        loans: state.loans,
        claimsPaid: state.claimsPaid,
        trash: state.trash,
        health: state.health,
        auditCount,
        slaBlocked,
        wagesPaid: state.wagesPaid,
        supplierPayable: state.supplierPayable
      };
    }

    function generateDailyReport(day, closedContext = closedDayEnvironmentSummary(day)) {
      const start = economy.dayStart || snapshotEconomy(economy, vendingAgent.auditTrail.length, vendingAgent.sla.blocked);
      const sales = economy.sales - start.sales;
      const revenue = economy.revenue - start.revenue;
      const costs = economy.costs - start.costs;
      const profit = revenue - costs;
      const missed = economy.missedSales - start.missedSales;
      const blocked = vendingAgent.sla.blocked - start.slaBlocked;
      const audits = vendingAgent.auditTrail.length - start.auditCount;
      const claims = economy.claimsPaid - start.claimsPaid;
      const payableDelta = economy.supplierPayable - start.supplierPayable;
      const learning = evolveVendingAgentFromDay({ day, sales, profit, missed, avgTraffic: closedContext.avgTraffic });
      const title = `${formatReportWeekday(day)} 日报`;
      const summary = `销售 ${sales} 单，收入 ¥${revenue.toFixed(2)}，成本 ¥${costs.toFixed(2)}，利润 ¥${profit.toFixed(2)}，流失 ${missed}。`;
      const risk = `SLA 拦截 ${blocked} 次，赔付 ¥${claims.toFixed(2)}，审计 ${audits} 条；贷款 ¥${economy.loans.toFixed(2)}，供货应付 ¥${economy.supplierPayable.toFixed(2)}。`;
      const environmentSummary = `全天环境：${closedContext.weather}/${closedContext.season}，${closedContext.holiday}，均值 ${closedContext.avgTraffic.toFixed(2)}，峰值 ${closedContext.peakTraffic.toFixed(2)}，日扰动 ${Math.round(closedContext.variance * 100)}%。`;
      const payableSummary = payableDelta === 0 ? "" : `供货账款变化 ¥${payableDelta.toFixed(2)}，下次月结 D${economy.nextSupplierSettlementDay}。`;
      economy.dailyReports.unshift({ day, title, summary, risk, environmentSummary, learning: `${learning}${payableSummary ? `；${payableSummary}` : ""}` });
      economy.dailyReports = economy.dailyReports.slice(0, 12);
      economy.dayStart = snapshotEconomy(economy, vendingAgent.auditTrail.length, vendingAgent.sla.blocked);
      vendingAgent.reasoningTrace = [
        { label: "日报输入", text: `${formatReportWeekday(day)} 00:00 自动结算，读取全天销售、风险和环境数据。` },
        { label: "经营摘要", text: summary },
        { label: "风险摘要", text: risk },
        { label: "外部环境", text: environmentSummary },
        { label: "学习更新", text: learning }
      ];
      rememberAI(`D${day} 日报生成：销售 ${sales} 单，利润 ¥${profit.toFixed(2)}。`);
      recordAudit("DAILY_REPORT", { day, sales, revenue, profit, blocked, claims }, 14, "committed", `D${day} 日报已生成。`);
    }

    function formatReportWeekday(day) {
      const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
      return weekdays[day % 7];
    }

    function evolveVendingAgentFromDay({ day, sales, profit, missed, avgTraffic }) {
      const learning = vendingAgent.learning;
      const previousBias = learning.restockBias;
      const lossPressure = missed > Math.max(2, sales * 0.25);
      if (lossPressure) learning.restockBias = clamp(learning.restockBias + 0.05, 0.88, 1.28);
      if (profit < -12 && !lossPressure) learning.restockBias = clamp(learning.restockBias - 0.04, 0.88, 1.28);
      if (avgTraffic > 1.18 && profit >= 0) learning.confidence = clamp(learning.confidence + 0.04, 0.25, 0.92);
      if (sales === 0 && missed === 0) learning.confidence = clamp(learning.confidence - 0.02, 0.2, 0.92);
      if (Math.abs(previousBias - learning.restockBias) >= 0.01) learning.version += 1;
      learning.lastInsight = `v${learning.version} 安全库存${Math.round(learning.restockBias * 100)}%，置信${Math.round(learning.confidence * 100)}%。`;
      if (day % 3 === 0 || Math.abs(previousBias - learning.restockBias) >= 0.01) rememberAI(`学习更新：${learning.lastInsight}`);
      return `学习进化：${learning.lastInsight}`;
    }

    function resetDailyPriceGovernance() {
      Object.keys(economy.priceChangesToday).forEach((id) => {
        economy.priceChangesToday[id] = 0;
      });
      economy.priceGovernance.lastAction = "新营业日开始，调价次数已清零。";
    }

    function updateSupplierSettlementSchedule(closedDay) {
      while (closedDay >= economy.nextSupplierSettlementDay) {
        const settlementDay = economy.nextSupplierSettlementDay;
        economy.nextSupplierSettlementDay += 28;
        if (economy.supplierPayable <= 0 || economy.supplierSettlementDue) continue;
        economy.supplierSettlementDue = true;
        economy.lastEvent = `D${settlementDay} 月结到期，供货商应收 ¥${economy.supplierPayable.toFixed(2)} 等待银行营业清算。`;
        recordAudit("SUPPLIER_MONTH_END", {
          settlementDay,
          payable: economy.supplierPayable
        }, 18, "pending", "供应商月底结算进入待清算状态。");
        rememberAI(`供应商月结到期：应付 ¥${economy.supplierPayable.toFixed(2)}。`);
      }
    }

    function holidayName(day, weekday) {
      if (day % 28 === 6 || day % 28 === 7) return "城市节";
      if (weekday === 0 || weekday === 6) return "周末";
      return "工作日";
    }

    function chooseWeather() {
      const season = seasonInfo().id;
      const roll = Math.random();
      if (season === "summer") {
        if (roll < 0.34) return "heat";
        if (roll < 0.58) return "rain";
      }
      if (season === "winter") {
        if (roll < 0.38) return "cold";
        if (roll < 0.55) return "cloudy";
      }
      if (roll < 0.2) return "rain";
      if (roll < 0.48) return "cloudy";
      return "sunny";
    }

    function weatherInfo() {
      return weatherTypes.find((item) => item.id === environment.weather) || weatherTypes[0];
    }

    function seasonInfo() {
      return seasonTypes.find((item) => item.id === environment.season) || seasonTypes[0];
    }

    function formatSimTime() {
      const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
      return `${weekdays[environment.weekday]} ${String(environment.hour).padStart(2, "0")}:${String(environment.minute).padStart(2, "0")}`;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function updateBuyerAgent(agent, delta, machine) {
      if (agent.wait > 0) {
        agent.wait -= delta;
        if (agent.wait <= 0 && agent.state !== "前往贩卖机") agent.state = "闲逛";
        return;
      }

      agent.cooldown -= delta;
      const roleTraffic = consumerTrafficFactor(agent);
      const demandChance = agent.demand * environment.demandIndex * roleTraffic;
      if (agent.cooldown <= 0 && agent.state === "闲逛" && Math.random() < demandChance * delta * 0.48) {
        agent.target = offsetPoint(machine, 12);
        agent.state = "前往贩卖机";
      }

      if (!agent.target) agent.target = randomParkPoint();
      const arrived = moveAgent(agent, delta);
      if (!arrived) return;

      if (agent.state === "前往贩卖机") {
        attemptPurchase(agent);
        agent.wait = 1.1;
        agent.cooldown = 2.8 + Math.random() * 4.5;
        agent.target = randomParkPoint();
        return;
      }

      if (agent.budget < 3 && Math.random() < 0.45) {
        agent.budget += 8 + Math.floor(Math.random() * 7);
        agent.state = "预算刷新";
        agent.wait = 0.8;
      }
      agent.target = randomParkPoint();
    }

    function consumerTrafficFactor(agent) {
      let factor = environment.trafficIndex;
      if (agent.role === "上班族") {
        const workday = environment.weekday >= 1 && environment.weekday <= 5 && environment.holiday === "工作日";
        const commute = workday && ((environment.hour >= 7 && environment.hour <= 9) || (environment.hour >= 17 && environment.hour <= 18));
        const workHours = isBusinessOpen("office");
        factor *= commute ? 1.45 : workHours ? 0.58 : 0.95;
      }
      if (agent.role === "学生") {
        const afterSchool = environment.weekday >= 1 && environment.weekday <= 5 && environment.hour >= 15 && environment.hour <= 19;
        factor *= afterSchool ? 1.42 : isBusinessOpen("school") ? 0.55 : 0.95;
      }
      if (agent.role === "游客") {
        factor *= environment.holiday === "工作日" ? 0.72 : 1.65;
      }
      if (agent.role === "跑步者") {
        const runTime = (environment.hour >= 6 && environment.hour <= 8) || (environment.hour >= 18 && environment.hour <= 20);
        factor *= runTime ? 1.55 : 0.72;
        if (environment.weather === "rain" || environment.weather === "cold") factor *= 0.42;
      }
      return clamp(factor, 0.05, 2.8);
    }

    function updateClosedLoop(delta, machine) {
      economy.health = Math.max(0, economy.health - delta * 0.09);
      economy.repairCooldown = Math.max(0, economy.repairCooldown - delta);
      economy.supplierSettlementNoticeTimer = Math.max(0, economy.supplierSettlementNoticeTimer - delta);
      economy.payrollNoticeTimer = Math.max(0, economy.payrollNoticeTimer - delta);
      economy.rentTimer -= delta;
      economy.wageTimer -= delta;
      economy.settlementTimer -= delta;
      vendingAgent.sla.premiumTimer -= delta;

      if (vendingAgent.sla.premiumTimer <= 0) {
        const premium = 2.5;
        ensureOperatorCash(premium);
        economy.operatorCash -= premium;
        economy.costs += premium;
        vendingAgent.sla.premiumPaid += premium;
        vendingAgent.sla.coveragePool += premium * 0.7;
        vendingAgent.sla.premiumTimer = 24;
        recordAudit("SLA_PREMIUM", { premium }, 12, "committed", "雇主风险保障保费已入池。");
      }

      if (economy.rentTimer <= 0) {
        const rent = 6;
        ensureOperatorCash(rent);
        economy.operatorCash -= rent;
        economy.parkCash += rent;
        economy.costs += rent;
        economy.rentTimer = 22;
        economy.lastEvent = `公园管理方收取 ¥${rent.toFixed(2)} 场地和电力费用。`;
      }

      if (economy.wageTimer <= 0) {
        if (payrollWindowOpen() && economy.payrollIssuedDay !== environment.day) {
          let totalWages = 0;
          agents.forEach((agent) => {
            if (agent.type === "consumer") {
              const wage = agent.role === "学生" ? 5 : 9;
              agent.budget += wage;
              totalWages += wage;
            }
          });
          economy.wagesPaid += totalWages;
          economy.payrollIssuedDay = environment.day;
          economy.wageTimer = 18;
          economy.lastEvent = `雇主在下班前发放 ¥${totalWages.toFixed(2)} 可支配收入。`;
        } else {
          economy.wageTimer = 2;
          if (!payrollWindowOpen() && economy.payrollNoticeTimer <= 0) {
            economy.lastEvent = "当前不在办公发薪窗口，工资发放延后。";
            economy.payrollNoticeTimer = 8;
          }
        }
      }

      if (economy.settlementTimer <= 0) {
        const fee = Math.min(1.2, Math.max(0.2, economy.sales * 0.01));
        if (isBusinessOpen("bank")) {
          ensureOperatorCash(fee);
          economy.operatorCash -= fee;
          economy.bankCash += fee;
          economy.costs += fee;
          economy.settlementTimer = 16;
          economy.lastEvent = `银行完成支付清算，收取 ¥${fee.toFixed(2)} 服务费。`;
        } else {
          economy.settlementTimer = 1.5;
          economy.lastEvent = "银行系统已闭市，支付清算延后。";
        }
      }

      processSupplierSettlement();

      if (economy.health < 18) {
        economy.lastEvent = "贩卖机故障风险很高，交易效率下降。";
      }

      if (environment.weather === "rain" && economy.trash > 0) {
        economy.trash = Math.max(0, economy.trash - delta * 0.05);
      }
    }

    function payrollWindowOpen() {
      return environment.weekday >= 1
        && environment.weekday <= 5
        && environment.hour >= 16
        && environment.hour < 17
        && isBusinessOpen("office");
    }

    function processSupplierSettlement() {
      if (!economy.supplierSettlementDue || economy.supplierPayable <= 0) return;
      if (!isBusinessOpen("bank") || !isBusinessOpen("supplier")) {
        if (economy.supplierSettlementNoticeTimer <= 0) {
          economy.lastEvent = "供应商月结待清算，银行或供货商尚未进入营业窗口。";
          economy.supplierSettlementNoticeTimer = 5;
        }
        return;
      }

      const amount = economy.supplierPayable;
      ensureOperatorCash(amount);
      economy.operatorCash -= amount;
      economy.supplierCash += amount;
      economy.supplierPayable = 0;
      economy.supplierSettlementDue = false;
      economy.supplierSettlements.unshift({ day: environment.day, amount });
      economy.supplierSettlements = economy.supplierSettlements.slice(0, 6);
      economy.lastEvent = `供应商月结完成，支付货款 ¥${amount.toFixed(2)}。`;
      recordAudit("SUPPLIER_MONTHLY_SETTLEMENT", { amount, day: environment.day }, 16, "settled", "供应商月结通过银行清算完成。");
      rememberAI(`供应商月结已清算 ¥${amount.toFixed(2)}。`);
    }

    function updateVendingAgent(delta, machine) {
      if (!vendingAgent.enabled) {
        vendingAgent.state = "人工监控";
        return;
      }

      vendingAgent.observationTimer -= delta;
      vendingAgent.decisionTimer -= delta;
      vendingAgent.priceTimer -= delta;

      if (vendingAgent.observationTimer <= 0) {
        vendingAgent.observations = observeEnvironment(machine);
        vendingAgent.observationTimer = 0.8;
        vendingAgent.state = "观测中";
      }

      if (vendingAgent.decisionTimer <= 0) {
        analyzeAndDecide();
        vendingAgent.decisionTimer = 2.2;
      }

      if (vendingAgent.priceTimer <= 0) {
        tunePrices();
        vendingAgent.priceTimer = 7;
      }
    }

    function observeEnvironment(machine) {
      const strategy = activeStrategy();
      const adaptiveLowStock = clamp(strategy.lowStock * vendingAgent.learning.restockBias, 0.22, 0.66);
      const stockRisk = productCatalog
        .filter((product) => economy.stock[product.id] / product.maxStock <= adaptiveLowStock)
        .map((product) => product.id);
      const traffic = agents.filter((agent) => {
        return agent.type === "consumer" && Math.hypot(agent.x - machine.x, agent.y - machine.y) < tile * 6;
      }).length;
      const learning = updateBotTrafficLearning(traffic);
      const bestSeller = productCatalog.reduce((best, product) => {
        return economy.recentSold[product.id] > economy.recentSold[best.id] ? product : best;
      }, productCatalog[0]);

      return {
        stockRisk,
        traffic,
        bestSeller: bestSeller.id,
        cash: economy.operatorCash,
        loan: economy.loans,
        health: economy.health,
        trash: economy.trash,
        profit: economy.revenue - economy.costs,
        weather: weatherInfo().label,
        season: seasonInfo().label,
        holiday: environment.holiday,
        time: formatSimTime(),
        trafficIndex: environment.trafficIndex,
        demandIndex: environment.demandIndex,
        learnedTraffic: learning.value,
        learningLabel: learning.label,
        adaptiveLowStock,
        pricePolicy: priceLockSummary(),
        supplierPayable: economy.supplierPayable
      };
    }

    function updateBotTrafficLearning(localTraffic) {
      const segment = trafficSegment();
      const learning = vendingAgent.learning;
      const normalizedTraffic = clamp(localTraffic / 2.6, 0.2, 2.1);
      const previous = learning.trafficSegments[segment] ?? 1;
      const next = previous * 0.88 + normalizedTraffic * 0.12;
      learning.trafficSegments[segment] = next;
      learning.samples += 1;
      learning.confidence = clamp(0.22 + learning.samples / 180, 0.22, 0.92);
      const label = `${trafficSegmentLabel(segment)}${Math.round(next * 100)}%`;
      environment.lastTrafficLearning = label;
      if (learning.samples % 18 === 0) {
        learning.lastInsight = `v${learning.version} ${label}，安全库存${Math.round(learning.restockBias * 100)}%。`;
      }
      return { value: next, label };
    }

    function analyzeAndDecide() {
      const observation = vendingAgent.observations;
      const decisions = [];

      if (!observation) return;

      if (vendingAgent.actions.restockOrder) {
        decisions.push(`补货单：${vendingAgent.actions.restockOrder.status}`);
      }
      if (vendingAgent.actions.repairRequested) decisions.push("等待维修员响应");
      if (vendingAgent.actions.cleanRequested) decisions.push("等待清洁员响应");

      if (observation.cash < 30 || (observation.stockRisk.length > 0 && observation.cash < 55)) {
        if (requestOperatingLoan("AI 预判现金不足，申请周转资金", 90)) decisions.push("申请周转贷款");
      }

      if (observation.stockRisk.length > 0 && !vendingAgent.actions.restockOrder && economy.restockCooldown <= 0) {
        const orderItems = Object.fromEntries(observation.stockRisk.map((id) => {
          const product = productCatalog.find((item) => item.id === id);
          return [id, Math.max(4, product.maxStock - economy.stock[id])];
        }));
        if (openRestockOrder(orderItems, observation)) {
          decisions.push(`下补货单：${labelsFor(observation.stockRisk)}`);
          rememberAI(`库存风险 ${labelsFor(observation.stockRisk)}，AI 已下补货单。`);
        } else {
          decisions.push("补货单被 SLA 拦截");
        }
      }

      if (observation.health < 52 && !vendingAgent.actions.repairRequested && economy.repairCooldown <= 0) {
        if (requestServiceAction("REPAIR_CALL", "repairRequested", 8, observation, "机器健康下降，AI 呼叫维修员。")) {
          decisions.push("呼叫维修员");
        }
      }

      if (observation.trash >= 8 && !vendingAgent.actions.cleanRequested) {
        if (requestServiceAction("CLEAN_CALL", "cleanRequested", 4, observation, "垃圾量升高，AI 呼叫清洁员。")) {
          decisions.push("呼叫清洁员");
        }
      }

      if (observation.profit < -18 && vendingAgent.strategy !== "profit") {
        vendingAgent.strategy = "profit";
        decisions.push("切换保利润策略");
        rememberAI("利润转负，AI 切换到保利润策略。");
      }

      if (decisions.length === 0) decisions.push(`维持${activeStrategy().label}策略`);
      vendingAgent.decisions = decisions.slice(0, 4);
      vendingAgent.reasoningTrace = buildReasoningTrace(observation, decisions);
      vendingAgent.state = decisions[0].startsWith("维持") ? "分析中" : "已决策";
    }

    function buildReasoningTrace(observation, decisions) {
      const strategy = activeStrategy();
      const stockSignal = observation.stockRisk.length ? labelsFor(observation.stockRisk) : "无";
      const serviceRisk = [
        observation.health < 52 ? "机器健康偏低" : "",
        observation.trash >= 8 ? "垃圾量偏高" : "",
        observation.cash < 30 ? "现金偏低" : ""
      ].filter(Boolean).join("，") || "服务风险可控";

      return [
        {
          label: "输入信号",
          text: `${observation.time}，${observation.weather}/${observation.season}，${observation.holiday}，客流 ${observation.traffic}，学习段 ${observation.learningLabel}，库存风险 ${stockSignal}，热卖 ${labelsFor([observation.bestSeller])}，现金 ¥${observation.cash.toFixed(0)}。`
        },
        {
          label: "经营约束",
          text: `策略 ${strategy.label}，补货阈值 ${(observation.adaptiveLowStock * 100).toFixed(0)}%，${observation.pricePolicy}，供货月结 D${economy.nextSupplierSettlementDay}，应付 ¥${economy.supplierPayable.toFixed(0)}，银行 ${isBusinessOpen("bank") ? "营业" : "闭市"}，${serviceRisk}。`
        },
        {
          label: "判断摘要",
          text: summarizeReasoningJudgment(observation)
        },
        {
          label: "输出动作",
          text: decisions.join(" / ")
        }
      ];
    }

    function summarizeReasoningJudgment(observation) {
      if (observation.stockRisk.length > 0) {
        return `预计 ${labelsFor(observation.stockRisk)} 有缺货风险，优先保障可售库存。`;
      }
      if (observation.learnedTraffic > 1.28 && observation.adaptiveLowStock > activeStrategy().lowStock) {
        return "学习到当前时段客流高于基线，提前提高安全库存阈值。";
      }
      if (observation.weather === "高温") {
        return "高温天气会推高饮水需求，继续监控水库存和价格弹性。";
      }
      if (observation.holiday !== "工作日" && observation.trafficIndex > 1.2) {
        return "节假日客流走高，优先保障游客购买体验。";
      }
      if (observation.health < 52) {
        return "机器健康低于服务阈值，优先降低故障导致的交易流失。";
      }
      if (observation.trash >= 8) {
        return "环境质量开始影响购买意愿，优先恢复现场体验。";
      }
      if (observation.profit < -18) {
        return "经营利润承压，优先控制成本并上调利润策略。";
      }
      if (observation.traffic >= 3) {
        return "附近客流活跃，维持可售状态并监控热卖商品价格。";
      }
      return "当前经营状态稳定，继续观测销售、库存和服务质量。";
    }

    function openRestockOrder(orderItems, observation) {
      const orderCost = estimateOrderCost(orderItems);
      const assessment = assessDecisionRisk("RESTOCK_ORDER", { orderItems, orderCost }, observation);
      if (!assessment.allowed) {
        blockDecision("RESTOCK_ORDER", assessment, `补货预算 ¥${orderCost.toFixed(2)} 超过 SLA 风险约束。`);
        return false;
      }
      vendingAgent.actions.restockOrder = {
        items: orderItems,
        status: "待物流取货",
        estimatedCost: orderCost
      };
      recordAudit("RESTOCK_ORDER", { orderItems, orderCost }, assessment.risk, "committed", `补货单通过 SLA：¥${orderCost.toFixed(2)}。`);
      return true;
    }

    function requestServiceAction(action, flag, cost, observation, message) {
      const assessment = assessDecisionRisk(action, { cost }, observation);
      if (!assessment.allowed) {
        blockDecision(action, assessment, `${message} 但 SLA 判定风险过高。`);
        return false;
      }
      vendingAgent.actions[flag] = true;
      recordAudit(action, { cost }, assessment.risk, "committed", message);
      rememberAI(message);
      return true;
    }

    function tunePrices() {
      const strategy = activeStrategy();
      const adjustments = [];
      const locked = [];
      productCatalog.forEach((product) => {
        const previousPrice = economy.prices[product.id];
        const lockHours = remainingPriceLockHours(product.id);
        if (lockHours > 0) {
          locked.push(`${product.label}${Math.ceil(lockHours)}h`);
          economy.recentSold[product.id] = Math.max(0, Math.floor(economy.recentSold[product.id] * 0.35));
          return;
        }
        if (economy.priceChangesToday[product.id] >= economy.priceGovernance.maxDailyChanges) {
          locked.push(`${product.label}今日已锁`);
          economy.recentSold[product.id] = Math.max(0, Math.floor(economy.recentSold[product.id] * 0.35));
          return;
        }
        const sold = economy.recentSold[product.id];
        const stockRatio = economy.stock[product.id] / product.maxStock;
        let target = product.price * strategy.priceBias;
        if (product.id === "water" && (environment.weather === "heat" || environment.season === "summer")) target += 0.3;
        if (product.id === "tea" && (environment.weather === "cold" || environment.season === "winter")) target += 0.25;
        if (environment.holiday !== "工作日" && product.id === "snack") target += 0.2;
        if (sold >= 4 && stockRatio < 0.55) target += 0.5;
        if (sold === 0 && stockRatio > 0.75 && strategy.id !== "stock") target -= 0.35;
        const governedTarget = clamp(
          target,
          previousPrice * (1 - economy.priceGovernance.maxSingleChangeRate),
          previousPrice * (1 + economy.priceGovernance.maxSingleChangeRate)
        );
        const nextPrice = Math.max(product.cost + 0.8, Math.min(product.price * 1.45, governedTarget));
        if (Math.abs(nextPrice - economy.prices[product.id]) >= 0.25) {
          const nextRounded = Number(nextPrice.toFixed(2));
          const assessment = assessDecisionRisk("PRICE_CHANGE", {
            product: product.id,
            previousPrice,
            nextPrice: nextRounded
          }, vendingAgent.observations);
          if (assessment.allowed) {
            economy.prices[product.id] = nextRounded;
            economy.priceLastChangedAt[product.id] = environment.elapsedHours;
            economy.priceChangesToday[product.id] += 1;
            adjustments.push(`${product.label} ¥${economy.prices[product.id].toFixed(2)}`);
            recordAudit("PRICE_CHANGE", { product: product.id, previousPrice, nextPrice: nextRounded }, assessment.risk, "committed", `${product.label}售价调整。`);
            rememberAI(`${product.label}售价调整为 ¥${economy.prices[product.id].toFixed(2)}。`);
          } else {
            blockDecision("PRICE_CHANGE", assessment, `${product.label}调价被 SLA 拦截。`);
          }
        }
        economy.recentSold[product.id] = Math.max(0, Math.floor(sold * 0.35));
      });
      if (adjustments.length > 0) {
        economy.priceGovernance.lastAction = `更新：${adjustments.join("，")}。`;
        vendingAgent.reasoningTrace = [
          { label: "价格输入", text: `策略 ${strategy.label}，近期销售和库存余量触发价格检查。` },
          { label: "调价约束", text: `同一商品至少间隔 ${economy.priceGovernance.minIntervalHours} 个模拟小时，每日最多 ${economy.priceGovernance.maxDailyChanges} 次，单次不超过 ${Math.round(economy.priceGovernance.maxSingleChangeRate * 100)}%。` },
          { label: "输出动作", text: `更新价格：${adjustments.join("，")}。` }
        ];
      } else if (locked.length > 0) {
        economy.priceGovernance.lastAction = `价格冻结：${locked.slice(0, 3).join("，")}。`;
      }
    }

    function requestOperatingLoan(reason, targetCash) {
      if (economy.operatorCash >= targetCash || economy.loans > 180) return false;
      if (!isBusinessOpen("bank")) {
        recordAudit("LOAN_REQUEST", { targetCash, bankOpen: false }, 40, "pending", "银行系统闭市，贷款申请延后。");
        rememberAI("银行系统已闭市，周转贷款延后到下一营业窗口。");
        return false;
      }
      const loan = Math.ceil((targetCash - economy.operatorCash) / 10) * 10;
      const assessment = assessDecisionRisk("LOAN_REQUEST", { loan, targetCash }, vendingAgent.observations);
      if (!assessment.allowed) {
        blockDecision("LOAN_REQUEST", assessment, `贷款 ¥${loan.toFixed(2)} 被 SLA 拦截。`);
        return false;
      }
      economy.operatorCash += loan;
      economy.bankCash -= loan;
      economy.loans += loan;
      economy.lastEvent = `${reason}：¥${loan.toFixed(2)}。`;
      recordAudit("LOAN_REQUEST", { loan, targetCash }, assessment.risk, "committed", reason);
      rememberAI(`银行授信到账 ¥${loan.toFixed(2)}。`);
      return true;
    }

    function assessDecisionRisk(action, payload = {}, observation = {}) {
      let risk = 18;
      const reasons = [];

      if (action === "LOAN_REQUEST") {
        const projectedLoans = economy.loans + payload.loan;
        risk += projectedLoans > vendingAgent.sla.maxLoan ? 55 : projectedLoans / 5;
        if (projectedLoans > vendingAgent.sla.maxLoan) reasons.push("贷款余额超过 SLA 上限");
      }

      if (action === "RESTOCK_ORDER") {
        risk += payload.orderCost > vendingAgent.sla.maxOrderCost ? 48 : payload.orderCost / 2;
        if (payload.orderCost > vendingAgent.sla.maxOrderCost) reasons.push("订单金额过高");
        if ((observation.stockRisk || []).length === 0) risk += 18;
      }

      if (action === "PRICE_CHANGE") {
        const delta = Math.abs(payload.nextPrice - payload.previousPrice);
        const ratio = delta / Math.max(payload.previousPrice, 1);
        risk += ratio > vendingAgent.sla.maxPriceChange ? 56 : ratio * 60;
        if (ratio > vendingAgent.sla.maxPriceChange) reasons.push("调价幅度超过保单限制");
        if (ratio > economy.priceGovernance.maxSingleChangeRate) {
          risk += 24;
          reasons.push("调价幅度超过业务治理上限");
        }
        if (remainingPriceLockHours(payload.product) > 0) {
          risk += 42;
          reasons.push("商品仍处于价格稳定期");
        }
        if (economy.priceChangesToday[payload.product] >= economy.priceGovernance.maxDailyChanges) {
          risk += 32;
          reasons.push("商品今日调价次数已用尽");
        }
      }

      if (action === "REPAIR_CALL") {
        risk += economy.health > 70 ? 32 : 8;
      }

      if (action === "CLEAN_CALL") {
        risk += economy.trash < 5 ? 28 : 8;
      }

      if ((observation.profit ?? economy.revenue - economy.costs) < -30) risk += 12;
      if (economy.operatorCash < 12) risk += 10;

      risk = Math.min(99, Math.round(risk));
      const allowed = !vendingAgent.sla.enabled || risk <= vendingAgent.sla.riskLimit;
      vendingAgent.sla.lastAssessment = `${action} 风险 ${risk}${reasons.length ? `：${reasons.join("，")}` : ""}`;
      return { allowed, risk, reasons };
    }

    function blockDecision(action, assessment, summary) {
      vendingAgent.sla.blocked += 1;
      vendingAgent.state = "SLA 拦截";
      economy.lastEvent = summary;
      rememberAI(summary);
      recordAudit(action, { blocked: true, reasons: assessment.reasons }, assessment.risk, "blocked", summary);
      if (assessment.risk > 88) settleClaim(6, `${action} 高风险决策被拦截，触发风险缓释赔付。`);
    }

    function settleClaim(amount, summary) {
      const payout = Math.min(amount, vendingAgent.sla.coveragePool);
      if (payout <= 0) return;
      vendingAgent.sla.coveragePool -= payout;
      vendingAgent.sla.claims += 1;
      economy.claimsPaid += payout;
      economy.operatorCash += payout;
      recordAudit("SLA_CLAIM", { payout }, 9, "settled", summary);
      rememberAI(`SLA 赔付 ¥${payout.toFixed(2)} 已到账。`);
    }

    function recordAudit(action, payload, risk, status, summary) {
      const previousHash = vendingAgent.auditTrail[0]?.hash || "GENESIS";
      const block = {
        height: vendingAgent.auditTrail.length + 1,
        action,
        payload,
        risk,
        status,
        summary,
        previousHash,
        hash: ""
      };
      block.hash = pseudoHash(JSON.stringify({
        height: block.height,
        action,
        payload,
        risk,
        status,
        summary,
        previousHash
      }));
      vendingAgent.auditTrail.unshift(block);
      vendingAgent.auditTrail = vendingAgent.auditTrail.slice(0, 24);
    }

    function pseudoHash(value) {
      let hash = 2166136261;
      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return `0x${(hash >>> 0).toString(16).padStart(8, "0")}`;
    }

    function estimateOrderCost(orderItems) {
      let wholesaleCost = 0;
      let boxes = 0;
      productCatalog.forEach((product) => {
        const amount = orderItems[product.id] || 0;
        boxes += amount;
        wholesaleCost += amount * product.cost;
      });
      return wholesaleCost + (boxes > 0 ? 4 + boxes * 0.25 : 0);
    }

    function remainingPriceLockHours(productId) {
      const lastChangedAt = economy.priceLastChangedAt?.[productId] ?? -Infinity;
      return Math.max(0, economy.priceGovernance.minIntervalHours - (environment.elapsedHours - lastChangedAt));
    }

    function priceLockSummary() {
      const lockedProducts = productCatalog
        .map((product) => ({ product, hours: remainingPriceLockHours(product.id) }))
        .filter(({ hours }) => hours > 0);
      if (lockedProducts.length === 0) return economy.priceGovernance.lastAction || "可审查";
      const first = lockedProducts[0];
      return `${first.product.label}锁${Math.ceil(first.hours)}h${lockedProducts.length > 1 ? ` +${lockedProducts.length - 1}` : ""}`;
    }

    function activeStrategy() {
      return strategyModes.find((strategy) => strategy.id === vendingAgent.strategy) || strategyModes[0];
    }

    function cycleStrategy() {
      const index = strategyModes.findIndex((strategy) => strategy.id === vendingAgent.strategy);
      const next = strategyModes[(index + 1) % strategyModes.length];
      vendingAgent.strategy = next.id;
      vendingAgent.decisions = [`切换${next.label}策略`];
      rememberAI(`人工切换 AI 策略：${next.label}。`);
    }

    function labelsFor(ids) {
      return ids.map((id) => productCatalog.find((product) => product.id === id)?.label || id).join("、");
    }

    function rememberAI(message) {
      if (!vendingAgent) return;
      vendingAgent.memory.unshift(message);
      vendingAgent.memory = vendingAgent.memory.slice(0, 8);
    }

    function needsRestock() {
      return Boolean(vendingAgent.actions.restockOrder);
    }

    function ensureOperatorCash(amount) {
      if (economy.operatorCash >= amount) return;
      const loan = Math.ceil((amount - economy.operatorCash + 25) / 10) * 10;
      if (!isBusinessOpen("bank")) {
        const overdraftFee = 1.5;
        economy.operatorCash += amount;
        economy.loans += amount + overdraftFee;
        economy.costs += overdraftFee;
        economy.lastEvent = `银行闭市，触发隔夜授信 ¥${amount.toFixed(2)}，费用 ¥${overdraftFee.toFixed(2)}。`;
        recordAudit("OVERNIGHT_CREDIT", { amount, overdraftFee }, 58, "committed", "银行闭市期间使用隔夜授信。");
        rememberAI(`银行闭市，使用隔夜授信 ¥${amount.toFixed(2)}。`);
        return;
      }
      economy.operatorCash += loan;
      economy.bankCash -= loan;
      economy.loans += loan;
      economy.lastEvent = `银行向经营者发放 ¥${loan.toFixed(2)} 周转贷款。`;
      rememberAI(`现金不足，自动触发银行周转贷款 ¥${loan.toFixed(2)}。`);
    }

    function updateSystemAgent(agent, delta, machine) {
      const availability = serviceAvailability(agent.type);
      if (agent.wait > 0) {
        agent.wait -= delta * availability;
        if (agent.wait <= 0) agent.state = "待命";
        return;
      }

      if (availability < 0.2) {
        agent.state = agent.type === "banker" ? "银行闭市" : "下班";
        agent.target = agentHomePoint(agent);
        moveAgent(agent, delta * 0.25);
        return;
      }

      if (agent.type === "logistics") {
        updateLogisticsAgent(agent, delta, machine);
        return;
      }

      if (agent.type === "repair") {
        updateRepairAgent(agent, delta, machine);
        return;
      }

      if (agent.type === "cleaner") {
        updateCleanerAgent(agent, delta, machine);
        return;
      }

      if (agent.type === "banker" && economy.supplierSettlementDue) {
        agent.target = objectPoint("supplier") || offsetPoint(machine, 18);
        agent.state = "月结清算";
      } else if (agent.type === "banker" && economy.loans > 0) {
        agent.target = offsetPoint(machine, 18);
        agent.state = "巡检贷款";
      } else if (agent.type === "manager" && economy.rentTimer < 4) {
        agent.target = offsetPoint(machine, 20);
        agent.state = "核算租费";
      } else if (agent.type === "supplier" && economy.supplierSettlementDue) {
        agent.target = objectPoint("bank") || agentHomePoint(agent);
        agent.state = "等月结";
      } else if (agent.type === "supplier" && needsRestock()) {
        agent.target = agentHomePoint(agent);
        agent.state = "备货";
      } else if (agent.type === "operator" && needsRestock()) {
        agent.target = offsetPoint(machine, 16);
        agent.state = "查库存";
      } else if (agent.type === "employer" && payrollWindowOpen() && economy.payrollIssuedDay !== environment.day) {
        agent.target = objectPoint("bank") || agentHomePoint(agent);
        agent.state = "发工资";
      } else if (!agent.target) {
        agent.target = agentHomePoint(agent);
      }

      const arrived = moveAgent(agent, delta);
      if (!arrived) return;

      agent.wait = 0.8 + Math.random() * 1.3;
      agent.target = randomParkPoint();
    }

    function updateLogisticsAgent(agent, delta, machine) {
      if (serviceAvailability(agent.type) < 0.3) {
        agent.state = "物流下班";
        agent.target = agentHomePoint(agent);
        moveAgent(agent, delta * 0.35);
        return;
      }
      if (needsRestock() && economy.restockCooldown <= 0 && agent.state !== "取货" && agent.state !== "配送") {
        agent.target = objectPoint("supplier") || agentHomePoint(agent);
        agent.state = "取货";
        vendingAgent.actions.restockOrder.status = "物流取货中";
      }

      if (!agent.target) agent.target = agentHomePoint(agent);
      const arrived = moveAgent(agent, delta);
      if (!arrived) return;

      if (agent.state === "取货") {
        agent.target = offsetPoint(machine, 10);
        agent.state = "配送";
        if (vendingAgent.actions.restockOrder) vendingAgent.actions.restockOrder.status = "配送中";
        return;
      }

      if (agent.state === "配送") {
        restockMachine(agent);
        agent.target = agentHomePoint(agent);
        return;
      }

      agent.wait = 0.8;
      agent.target = randomParkPoint();
    }

    function updateRepairAgent(agent, delta, machine) {
      if (vendingAgent.actions.repairRequested && economy.repairCooldown <= 0 && agent.state !== "维修") {
        agent.target = offsetPoint(machine, 8);
        agent.state = "维修";
      }
      if (!agent.target) agent.target = agentHomePoint(agent);
      const arrived = moveAgent(agent, delta);
      if (!arrived) return;
      if (agent.state === "维修") {
        const fee = 8;
        ensureOperatorCash(fee);
        economy.operatorCash -= fee;
        economy.costs += fee;
        economy.health = 100;
        economy.repairCooldown = 18;
        vendingAgent.actions.repairRequested = false;
        agent.state = "完成维修";
        agent.wait = 1.5;
        agent.target = agentHomePoint(agent);
        economy.lastEvent = "维修员完成贩卖机保养，机器健康恢复。";
        recordAudit("REPAIR_SETTLED", { fee }, 10, "settled", "维修完成并结算费用。");
        return;
      }
      agent.target = randomParkPoint();
    }

    function updateCleanerAgent(agent, delta, machine) {
      if (vendingAgent.actions.cleanRequested && agent.state !== "清运") {
        agent.target = offsetPoint(machine, 18);
        agent.state = "清运";
      }
      if (!agent.target) agent.target = agentHomePoint(agent);
      const arrived = moveAgent(agent, delta);
      if (!arrived) return;
      if (agent.state === "清运") {
        economy.trash = Math.max(0, economy.trash - 10);
        vendingAgent.actions.cleanRequested = false;
        agent.state = "完成清运";
        agent.wait = 1.3;
        agent.target = agentHomePoint(agent);
        economy.lastEvent = "清洁员回收包装垃圾，公园消费环境改善。";
      recordAudit("CLEAN_SETTLED", { remainingTrash: economy.trash }, 8, "settled", "清洁任务完成，环境风险下降。");
        return;
      }
      agent.target = randomParkPoint();
    }

    function wanderAgent(agent, delta) {
      if (agent.wait > 0) {
        agent.wait -= delta;
        return;
      }
      if (!agent.target) agent.target = randomParkPoint();
      if (moveAgent(agent, delta)) agent.target = randomParkPoint();
    }

    function moveAgent(agent, delta) {
      const dx = agent.target.x - agent.x;
      const dy = agent.target.y - agent.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 2) return true;
      const step = Math.min(distance, agent.speed * delta);
      agent.x += (dx / distance) * step;
      agent.y += (dy / distance) * step;
      return distance <= step + 2;
    }

    function offsetPoint(point, radius) {
      const angle = Math.random() * Math.PI * 2;
      return {
        x: Math.max(tile, Math.min(canvas.width - tile, point.x + Math.cos(angle) * radius)),
        y: Math.max(tile, Math.min(canvas.height - tile, point.y + Math.sin(angle) * radius))
      };
    }

    function attemptPurchase(agent) {
      const weather = weatherInfo();
      const season = seasonInfo();
      if (economy.health < 15 && Math.random() < 0.45) {
        economy.missedSales += 1;
        agent.state = "机器故障";
        economy.lastEvent = `${agent.role}遇到机器故障，交易流失。`;
        return;
      }

      if (economy.trash > 18 && Math.random() < 0.28) {
        economy.missedSales += 1;
        agent.state = "环境劝退";
        economy.lastEvent = `${agent.role}因垃圾堆积放弃购买。`;
        return;
      }

      const product = agent.preference
        .map((id) => productCatalog.find((item) => item.id === id))
        .sort((a, b) => productDemandWeight(b, weather, season) - productDemandWeight(a, weather, season))
        .find((item) => item && economy.stock[item.id] > 0 && agent.budget >= economy.prices[item.id]);

      if (!product) {
        const hasPreferredStock = agent.preference.some((id) => economy.stock[id] > 0);
        economy.missedSales += 1;
        agent.state = hasPreferredStock ? "预算不足" : "缺货";
        economy.lastEvent = `${agent.role}没有完成购买，需求被记录为流失。`;
        return;
      }

      economy.stock[product.id] -= 1;
      economy.sold[product.id] += 1;
      economy.recentSold[product.id] += 1;
      const price = economy.prices[product.id];
      economy.revenue += price;
      economy.sales += 1;
      const bankFee = price * 0.03;
      economy.operatorCash += price - bankFee;
      economy.bankCash += bankFee;
      economy.trash += 1;
      economy.health = Math.max(0, economy.health - 0.55);
      agent.budget -= price;
      agent.spent += price;
      agent.state = `买了${product.label}`;
      economy.lastEvent = `${agent.role}花 ¥${price.toFixed(2)} 买了${product.label}。`;

      if (economy.loans > 0 && economy.operatorCash > 80) {
        const payment = Math.min(economy.loans, 10);
        economy.operatorCash -= payment;
        economy.bankCash += payment;
        economy.loans -= payment;
      }
    }

    function productDemandWeight(product, weather = weatherInfo(), season = seasonInfo()) {
      if (!product) return 0;
      let weight = 1;
      if (product.id === "water") weight *= weather.water * season.water;
      if (product.id === "tea") weight *= environment.weather === "cold" || environment.season === "winter" ? 1.25 : 1;
      if (product.id === "snack") weight *= season.snack;
      return weight;
    }

    function restockMachine(agent) {
      let boxes = 0;
      let wholesaleCost = 0;
      const orderedItems = vendingAgent.actions.restockOrder?.items || null;
      productCatalog.forEach((product) => {
        const missing = product.maxStock - economy.stock[product.id];
        const ordered = orderedItems ? Math.min(missing, orderedItems[product.id] || 0) : missing;
        boxes += ordered;
        wholesaleCost += ordered * product.cost;
        economy.stock[product.id] += ordered;
      });
      const deliveryFee = boxes > 0 ? 4 + boxes * 0.25 : 0;
      const totalCost = wholesaleCost + deliveryFee;
      ensureOperatorCash(deliveryFee);
      economy.operatorCash -= deliveryFee;
      economy.supplierPayable += wholesaleCost;
      economy.logisticsCash += deliveryFee;
      economy.costs += totalCost;
      economy.restockCooldown = 15;
      vendingAgent.actions.restockOrder = null;
      agent.state = "完成补货";
      agent.wait = 1.4;
      economy.lastEvent = `${agent.role}配送 ${boxes} 件商品，供货 ¥${wholesaleCost.toFixed(2)} 计入月结，应付累计 ¥${economy.supplierPayable.toFixed(2)}。`;
      recordAudit("RESTOCK_SETTLED", { boxes, wholesaleCost, deliveryFee, supplierPayable: economy.supplierPayable }, 11, "settled", "补货交付完成，供应商货款进入月结账本。");
      rememberAI(`补货完成：${boxes} 件商品入柜。`);
      if (boxes === 0 && totalCost === 0) settleClaim(3, "空配送被识别为无效执行，SLA 小额赔付。");
    }

    function clearPark() {
      pushUndo();
      park = createPark();
      resetEconomy(false);
      savePark();
      draw();
    }

    function fillGrass() {
      pushUndo();
      park.forEach((row) => {
        row.forEach((cell) => {
          cell.terrain = "grass";
        });
      });
      savePark();
      draw();
    }

    function randomPark(trackUndo = true) {
      if (trackUndo) pushUndo();
      park = createPark();

      fillTerrainRect(0, 0, columns - 1, rows - 1, "plaza");
      fillTerrainRect(5, 4, 32, 20, "grass");

      for (let column = 0; column < columns; column += 1) {
        park[3][column].terrain = "path";
        park[21][column].terrain = "path";
      }

      for (let row = 0; row < rows; row += 1) {
        park[row][4].terrain = "path";
        park[row][33].terrain = "path";
      }

      fillTerrainRect(5, 11, 32, 12, "path");
      fillTerrainRect(18, 4, 19, 20, "path");
      fillTerrainRect(16, 10, 21, 14, "plaza");
      fillTerrainRect(16, 17, 21, 20, "plaza");

      for (let row = 5; row <= 20; row += 1) {
        park[row][5].terrain = "path";
        park[row][32].terrain = "path";
      }

      for (let column = 6; column <= 31; column += 1) {
        park[5][column].terrain = "path";
        park[20][column].terrain = "path";
      }

      placeObject(2, 2, "supplier");
      placeObject(6, 2, "logistics");
      placeObject(15, 2, "bank");
      placeObject(22, 2, "office");
      placeObject(29, 2, "school");
      placeObject(35, 6, "parkOffice");
      placeObject(35, 13, "repairShop");
      placeObject(35, 19, "recycleCenter");
      placeObject(18, 16, "vending");

      const pondCenter = {
        column: 26 + Math.floor(Math.random() * 2),
        row: 8 + Math.floor(Math.random() * 2)
      };
      for (let row = pondCenter.row - 2; row <= pondCenter.row + 2; row += 1) {
        for (let column = pondCenter.column - 3; column <= pondCenter.column + 3; column += 1) {
          const distance = Math.abs(column - pondCenter.column) / 3 + Math.abs(row - pondCenter.row) / 2;
          if (column >= 0 && column < columns && row >= 0 && row < rows && distance < 1.15) {
            park[row][column].terrain = "water";
            park[row][column].object = null;
          }
        }
      }

      for (let column = 7; column < 31; column += 4) {
        park[6][column].object = "tree";
        park[19][column].object = "tree";
      }
      for (let row = 7; row < 19; row += 3) {
        park[row][6].object = "tree";
        park[row][31].object = "tree";
      }

      scatter("tree", 24);
      scatter("flower", 52);
      scatter("rock", 8);
      placeOnCitySurface("bench", 14);
      placeOnCitySurface("lamp", 22);
      placeOnCitySurface("trash", 12);
      placeOnCitySurface("sign", 6);
      ensureVendingMachine();
      resetEconomy(false);

      savePark();
      draw();
    }

    function fillTerrainRect(left, top, right, bottom, terrain) {
      for (let row = top; row <= bottom; row += 1) {
        for (let column = left; column <= right; column += 1) {
          if (park[row]?.[column]) {
            park[row][column].terrain = terrain;
            if (terrain === "water") park[row][column].object = null;
          }
        }
      }
    }

    function placeObject(column, row, object, terrain = "plaza") {
      const cell = park[row]?.[column];
      if (!cell) return;
      cell.terrain = terrain;
      cell.object = object;
    }

    function scatter(object, amount) {
      let placed = 0;
      let attempts = 0;
      while (placed < amount && attempts < amount * 18) {
        attempts += 1;
        const row = Math.floor(Math.random() * rows);
        const column = Math.floor(Math.random() * columns);
        const cell = park[row][column];
        if (cell.terrain === "grass" && !cell.object && Math.random() > 0.22) {
          cell.object = object;
          placed += 1;
        }
      }
    }

    function placeOnCitySurface(object, amount) {
      let placed = 0;
      let attempts = 0;
      while (placed < amount && attempts < amount * 40) {
        attempts += 1;
        const row = Math.floor(Math.random() * rows);
        const column = Math.floor(Math.random() * columns);
        const cell = park[row][column];
        const isCitySurface = cell.terrain === "path" || cell.terrain === "plaza";
        const nearGreen = neighbors(column, row).some(([neighborColumn, neighborRow]) => {
          return park[neighborRow]?.[neighborColumn]?.terrain === "grass";
        });
        if (isCitySurface && nearGreen && !cell.object) {
          cell.object = object;
          placed += 1;
        }
      }
    }

    function neighbors(column, row) {
      return [
        [column - 1, row],
        [column + 1, row],
        [column, row - 1],
        [column, row + 1]
      ].filter(([neighborColumn, neighborRow]) => {
        return neighborColumn >= 0 && neighborColumn < columns && neighborRow >= 0 && neighborRow < rows;
      });
    }

    function beginDraw(event) {
      event.preventDefault();
      canvas.setPointerCapture(event.pointerId);
      drawing = true;
      lastPainted = "";
      pushUndo();
      const { column, row } = pointerToCell(event);
      paintAt(column, row);
    }

    function moveDraw(event) {
      if (!drawing) return;
      event.preventDefault();
      const { column, row } = pointerToCell(event);
      if (column >= 0 && column < columns && row >= 0 && row < rows) paintAt(column, row);
    }

    function endDraw(event) {
      if (!drawing) return;
      drawing = false;
      lastPainted = "";
      canvas.releasePointerCapture(event.pointerId);
    }

    canvas.addEventListener("pointerdown", beginDraw);
    canvas.addEventListener("pointermove", moveDraw);
    canvas.addEventListener("pointerup", endDraw);
    canvas.addEventListener("pointercancel", endDraw);
    canvas.addEventListener("pointerleave", (event) => {
      if (drawing) endDraw(event);
    });

    brushInput.addEventListener("input", () => {
      brushValue.textContent = brushInput.value;
    });

    undoButton.addEventListener("click", () => {
      const previous = undoStack.pop();
      if (!previous) return;
      park = previous;
      savePark();
      draw();
    });

    randomButton.addEventListener("click", randomPark);
    clearButton.addEventListener("click", clearPark);
    fillButton.addEventListener("click", fillGrass);
    economyToggle.addEventListener("click", () => {
      economyRunning = !economyRunning;
      economy.lastEvent = economyRunning ? "经济模拟继续运行。" : "经济模拟已暂停。";
      renderEconomyPanel(true);
    });

    liveModeToggle.addEventListener("click", () => {
      setLiveMode(!liveMode);
    });
    liveSimInput.value = liveSimCode;
    liveSimInput.addEventListener("change", () => {
      liveSimCode = liveSimInput.value.trim();
      try { window.localStorage.setItem("micro-city-live-sim", liveSimCode); } catch (_) {}
      liveJournalSeen = 0;
      if (liveMode) restartLiveTimer();
    });

    function setLiveMode(on) {
      liveMode = on;
      liveModeToggle.textContent = on ? "Live ●" : "Live";
      liveModeToggle.classList.toggle("primary", on);
      liveConfig.style.display   = on ? "block" : "none";
      if (on) {
        // Pause the rule-based sim so it doesn't fight the backend feed.
        economyRunning = false;
        economyToggle.textContent = "运行";
        economy.lastEvent = "Live 模式：从 /api/vending 拉取真实状态。";
        liveJournalSeen = 0;
        restartLiveTimer();
        liveTick(true);
      } else {
        if (liveTimerId) { clearInterval(liveTimerId); liveTimerId = null; }
        economy.lastEvent = "回到 Playground，规则模拟继续。";
        economyRunning = true;
        economyToggle.textContent = "暂停";
        liveStatus.textContent = "";
      }
      renderEconomyPanel(true);
    }

    function restartLiveTimer() {
      if (liveTimerId) clearInterval(liveTimerId);
      liveTimerId = setInterval(() => liveTick(false), 1500);
    }

    async function liveTick(force) {
      if (!liveMode) return;
      if (!liveSimCode) {
        liveStatus.textContent = "请填写 sim_code";
        return;
      }
      try {
        const sim = encodeURIComponent(liveSimCode);
        const [stateRes, journalRes, personasRes, slaRes, supplierRes, reportRes] = await Promise.all([
          fetch(`${liveApiBase}/api/vending/state/${sim}/`),
          fetch(`${liveApiBase}/api/vending/journal/${sim}/?since=${liveJournalSeen}`),
          fetch(`${liveApiBase}/api/vending/personas/${sim}/`),
          fetch(`${liveApiBase}/api/vending/sla/${sim}/`),
          fetch(`${liveApiBase}/api/vending/supplier/${sim}/`),
          fetch(`${liveApiBase}/api/vending/daily_report/${sim}/?limit=8`)
        ]);
        if (!stateRes.ok) {
          liveStatus.textContent = `state ${stateRes.status}`;
          return;
        }
        const state    = await stateRes.json();
        const journal  = journalRes.ok  ? await journalRes.json()  : { entries: [], count: 0 };
        const personas = personasRes.ok ? await personasRes.json() : { personas: [] };
        const sla      = slaRes.ok      ? await slaRes.json()      : null;
        const supplier = supplierRes.ok ? await supplierRes.json() : null;
        const report   = reportRes.ok   ? await reportRes.json()   : null;
        applyLiveState(state, journal, personas, force, sla, supplier, report);
        liveStatus.textContent = `${state.curr_time || ""}  step ${state.step ?? "?"}  +${journal.count} 条`;
      } catch (err) {
        liveStatus.textContent = `离线：${err.message || err}`;
      }
    }

    function applyLiveState(stateBody, journalBody, personasBody, force, slaBody, supplierBody, reportBody) {
      // 0. SLA + supplier + daily report — overlay backend authority on top
      // of the rule sim's mirror state. Sections silently skip when null.
      if (slaBody && slaBody.sla_state) {
        const s = slaBody.sla_state;
        vendingAgent.sla.enabled        = !!s.enabled;
        vendingAgent.sla.blocked        = s.blocked        ?? vendingAgent.sla.blocked;
        vendingAgent.sla.claims         = s.claims         ?? vendingAgent.sla.claims;
        vendingAgent.sla.riskLimit      = s.risk_limit     ?? vendingAgent.sla.riskLimit;
        vendingAgent.sla.maxLoan        = (s.max_loan_cents       ?? vendingAgent.sla.maxLoan       * 100) / 100;
        vendingAgent.sla.maxOrderCost   = (s.max_order_cost_cents ?? vendingAgent.sla.maxOrderCost  * 100) / 100;
        vendingAgent.sla.maxPriceChange = s.max_price_change      ?? vendingAgent.sla.maxPriceChange;
        vendingAgent.sla.coveragePool   = (s.coverage_pool_cents  ?? vendingAgent.sla.coveragePool  * 100) / 100;
        vendingAgent.sla.lastAssessment = s.last_assessment       ?? vendingAgent.sla.lastAssessment;
      }
      if (supplierBody) {
        economy.supplierPayable = (supplierBody.payable_total_cents || 0) / 100;
        if (supplierBody.next_due) {
          const dueIso = supplierBody.next_due.due_date;
          const dueAmt = (supplierBody.next_due.total_cents || 0) / 100;
          economy.priceGovernance.lastAction =
            `次回支払 ${dueIso} ¥${dueAmt.toFixed(0)} (${supplierBody.next_due.supplier_id})`;
        }
      }
      if (reportBody && reportBody.last_report) {
        const r = reportBody.last_report;
        economy.dailyReports = [
          {
            day:    r.date_iso,
            title:  `${r.date_iso} 日报`,
            summary: `销售 ${r.sales_count} 单，收入 ¥${(r.revenue_cents/100).toFixed(0)}，` +
                     `成本 ¥${(r.cost_cents/100).toFixed(0)}，利润 ¥${(r.profit_cents/100).toFixed(0)}，流失 ${r.missed_count}。`,
            risk:   `SLA 拦截 ${r.sla_blocked} 次，审计 ${r.audit_count} 条。`,
            environmentSummary: `${r.weather_label}/${r.season_label}，${r.holiday_label}；客流均值 ${r.avg_traffic.toFixed(2)}，峰值 ${r.peak_traffic.toFixed(2)}。`,
            learning: r.thought_text,
          },
          ...(reportBody.history || []).slice(0, 6).map((h) => ({
            day: h.date_iso, title: `${h.date_iso} 日报`,
            summary: `销售 ${h.sales_count} 单，利润 ¥${(h.profit_cents/100).toFixed(0)}。`,
            risk: `SLA 拦截 ${h.sla_blocked}。`,
            environmentSummary: `${h.weather_label}/${h.season_label}`,
            learning: h.thought_text,
          })),
        ];
      }

      // Render the dedicated supplier + daily-report panels (live data only;
      // playground mode keeps them empty).
      renderSupplierPanel(supplierBody);
      renderDailyReportPanel(reportBody);

      // 1. Inventory + prices come from VendingState.
      const vs = stateBody.vending_state || {};
      if (vs.inventory) {
        for (const [sku, qty] of Object.entries(vs.inventory)) {
          if (sku in economy.stock) economy.stock[sku] = qty;
        }
      }
      if (vs.prices_cents) {
        for (const [sku, cents] of Object.entries(vs.prices_cents)) {
          if (sku in economy.prices) economy.prices[sku] = cents / 100;
        }
      }
      if (typeof vs.cash_balance_cents === "number") {
        economy.operatorCash = vs.cash_balance_cents / 100;
        economy.revenue      = vs.cash_balance_cents / 100;
      }
      if (typeof vs.power_pct === "number") {
        economy.health = vs.power_pct;
      }

      // 2. Journal entries become audit-trail blocks.
      if (journalBody.count > 0) {
        liveJournalSeen += journalBody.count;
        for (const entry of journalBody.entries) {
          const action = (entry.kind || "").toUpperCase();
          const status = action.startsWith("TX_")   ? "committed"
                       : action === "INTENT_FAIL"  ? "failed"
                       : action.startsWith("INTENT_") ? "queued"
                       : "noted";
          recordAudit(action,
                      { local_uuid: entry.local_uuid, on_chain_id: entry.on_chain_id, tx_hash: entry.tx_hash },
                      6, status,
                      entry.description || entry.tx_hash || entry.local_uuid || entry.kind);
        }
      }

      // 3. Persona positions: minimal mapping into the rendered agent list.
      if (Array.isArray(personasBody.personas)) {
        agents = personasBody.personas.map((p, i) => {
          const cellSize = (canvas.width / columns) || 32;
          return {
            role:   p.name,
            type:   p.role === "vendor" ? "operator" : "consumer",
            color:  p.role === "vendor" ? "#4d6f9f"  : "#ba4e6a",
            x:      (p.x || 0) * cellSize,
            y:      (p.y || 0) * cellSize,
            cellX:  p.x,
            cellY:  p.y,
            radius: 7,
            id:     i,
          };
        });
      }

      renderEconomyPanel(force === true);
    }

    function renderSupplierPanel(body) {
      if (!supplierPayableValue) return;
      if (!body) {
        supplierPayableValue.textContent = "—";
        supplierNextDue.textContent      = "未对接后端";
        supplierInvoicesList.innerHTML   = "";
        return;
      }
      const payable = (body.payable_total_cents || 0) / 100;
      supplierPayableValue.textContent = `¥${payable.toFixed(0)}`;
      if (body.next_due) {
        const due = body.next_due;
        const overdue = due.due_date && new Date(due.due_date) < new Date();
        supplierNextDue.innerHTML =
          `次回支払：<strong>${due.due_date}</strong> ` +
          `¥${((due.total_cents || 0) / 100).toFixed(0)} ` +
          `<span style="color:${overdue ? '#c44d31' : 'var(--muted)'}">` +
          `(${due.supplier_id} ${overdue ? '· 逾期' : ''})</span>`;
      } else {
        supplierNextDue.textContent = "无未结算账单";
      }
      const invoices = (body.invoices || []).slice(0, 5);
      supplierInvoicesList.innerHTML = invoices.map((inv) => {
        const total = ((inv.total_cents || 0) / 100).toFixed(0);
        const tax   = ((inv.tax_cents   || 0) / 100).toFixed(0);
        const stat  = inv.paid ? "已付" : "未付";
        const color = inv.paid ? "var(--muted)" : "var(--ink)";
        return `
          <div class="audit-row" style="color:${color};display:flex;justify-content:space-between;font-size:0.84rem;padding:3px 0;border-bottom:1px dashed var(--line);">
            <span>${inv.invoice_id} · ${inv.supplier_id}</span>
            <span>支払 ${inv.due_date}</span>
            <span>¥${total}（税 ¥${tax}）${stat}</span>
          </div>
        `;
      }).join("") || `<div style="color:var(--muted);font-size:0.8rem;">无未结算账单。</div>`;
    }

    function renderDailyReportPanel(body) {
      if (!dailyKpiChips) return;
      if (!body || !body.last_report) {
        dailyKpiChips.innerHTML = "";
        dailyProfitSparkline.innerHTML = "";
        return;
      }
      const r = body.last_report;
      const cumul = body.cumulative || {};
      const chip = (label, val, tone) => `
        <span style="font-size:0.78rem;padding:3px 8px;border-radius:99px;
                     background:${tone || 'rgba(47, 125, 98, 0.08)'};color:var(--ink);
                     border:1px solid var(--line);white-space:nowrap;">
          ${label} <strong>${val}</strong>
        </span>`;
      const profitTone = r.profit_cents >= 0 ? "rgba(47, 125, 98, 0.16)" : "rgba(196, 77, 49, 0.18)";
      dailyKpiChips.innerHTML = [
        chip("销售", r.sales_count),
        chip("收入", `¥${(r.revenue_cents / 100).toFixed(0)}`),
        chip("利润", `¥${(r.profit_cents / 100).toFixed(0)}`, profitTone),
        chip("流失", r.missed_count, r.missed_count > 0 ? "rgba(196, 77, 49, 0.12)" : null),
        chip("SLA", r.sla_blocked, r.sla_blocked > 0 ? "rgba(196, 77, 49, 0.12)" : null),
        chip("审计", r.audit_count),
        chip("客流", `${r.avg_traffic.toFixed(2)}/${r.peak_traffic.toFixed(2)}`),
        chip(r.weather_label, r.season_label),
        chip(r.holiday_label, ""),
      ].join("");

      // Mini-sparkline: last 14 days of profit, scaled to chart height.
      const series = (body.history || []).slice(0, 14).reverse();
      if (!series.length) {
        dailyProfitSparkline.innerHTML = "";
        return;
      }
      const profits = series.map((h) => h.profit_cents / 100);
      const peak = Math.max(1, ...profits.map(Math.abs));
      dailyProfitSparkline.innerHTML = profits.map((p) => {
        const h = Math.max(2, Math.round((Math.abs(p) / peak) * 30));
        const color = p >= 0 ? "var(--accent)" : "#c44d31";
        return `<span title="¥${p.toFixed(0)}" style="display:inline-block;width:6px;height:${h}px;background:${color};border-radius:2px;"></span>`;
      }).join("");
    }

    if (liveSimCode) {
      // If a sim was previously selected, surface the toggle hint without auto-enabling.
      liveStatus.textContent = `上次 sim：${liveSimCode}（点 Live 启动）`;
    }
    aiToggleButton.addEventListener("click", () => {
      vendingAgent.enabled = !vendingAgent.enabled;
      vendingAgent.state = vendingAgent.enabled ? "观测中" : "人工监控";
      rememberAI(vendingAgent.enabled ? "AI 自动经营已恢复。" : "AI 自动经营已暂停。");
      renderEconomyPanel(true);
    });
    aiStrategyButton.addEventListener("click", () => {
      cycleStrategy();
      renderEconomyPanel(true);
    });
    resetEconomyButton.addEventListener("click", () => {
      resetEconomy(true, "经济系统已重置，代理重新入园。");
    });
    gridToggle.addEventListener("change", () => {
      showGrid = gridToggle.checked;
      draw();
    });

    window.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") {
        event.preventDefault();
        undoButton.click();
      }
    });

    buildTools();
    if (!saved) randomPark(false);
    ensureVendingMachine();
    savePark();
    resetEconomy(false);
    draw();

    function animate(time) {
      const delta = Math.min(0.12, (time - lastFrameTime) / 1000);
      lastFrameTime = time;
      updateEconomy(delta);
      draw();
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
