<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>城市微观公园沙盒</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ecebe4;
      --ink: #1f2928;
      --muted: #626c6a;
      --line: #c7c4b8;
      --panel: #fbfaf4;
      --accent: #2f7d62;
      --accent-strong: #1f5f49;
      --asphalt: #747b7b;
      --curb: #d8d1c2;
      --shadow: 0 18px 40px rgba(38, 43, 41, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background:
        linear-gradient(90deg, rgba(84, 91, 91, 0.16) 1px, transparent 1px),
        linear-gradient(rgba(84, 91, 91, 0.13) 1px, transparent 1px),
        linear-gradient(135deg, rgba(196, 77, 49, 0.08), transparent 28%),
        var(--paper);
      background-size: 32px 32px, 32px 32px, 100% 100%;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1480px, calc(100vw - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 0 22px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 2.1rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .meta {
      min-width: 180px;
      text-align: right;
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr) 310px;
      gap: 16px;
      align-items: stretch;
    }

    .tools,
    .dashboard {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }

    .tools {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .tool {
      min-width: 0;
      border: 1px solid #d7d0bd;
      background: #fbfaf4;
      color: var(--ink);
      border-radius: 7px;
      padding: 9px 8px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .tool:hover {
      transform: translateY(-1px);
      border-color: #a4b59c;
    }

    .tool.active {
      border-color: var(--accent-strong);
      background: #edf6ef;
      box-shadow: inset 0 0 0 1px rgba(31, 95, 73, 0.18);
    }

    .swatch {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(33, 49, 44, 0.18);
      border-radius: 5px;
      display: inline-block;
      position: relative;
      overflow: hidden;
      background: #8fca72;
    }

    .swatch.path {
      background:
        linear-gradient(135deg, rgba(117, 93, 62, 0.16) 25%, transparent 25% 50%, rgba(117, 93, 62, 0.16) 50% 75%, transparent 75%),
        #d4be8b;
      background-size: 9px 9px;
    }

    .swatch.plaza {
      background:
        linear-gradient(90deg, rgba(90, 88, 82, 0.24) 1px, transparent 1px),
        linear-gradient(rgba(90, 88, 82, 0.24) 1px, transparent 1px),
        #c7c0b1;
      background-size: 8px 8px;
    }

    .swatch.water {
      background:
        radial-gradient(circle at 30% 35%, #d1f1ff 0 2px, transparent 3px),
        #58a7d3;
    }

    .swatch.tree {
      background:
        radial-gradient(circle at 50% 45%, #2d8548 0 8px, transparent 9px),
        linear-gradient(#8d613d, #8d613d);
      background-size: 100% 100%, 5px 14px;
      background-position: center, center 9px;
      background-repeat: no-repeat;
    }

    .swatch.flower {
      background:
        radial-gradient(circle at 50% 50%, #ffd658 0 2px, transparent 3px),
        radial-gradient(circle at 35% 35%, #e34f71 0 4px, transparent 5px),
        radial-gradient(circle at 65% 35%, #ef775d 0 4px, transparent 5px),
        radial-gradient(circle at 50% 67%, #7bbd57 0 5px, transparent 6px),
        #8fca72;
    }

    .swatch.bench {
      background:
        linear-gradient(#875331 0 4px, transparent 4px 8px, #875331 8px 12px, transparent 12px),
        linear-gradient(90deg, transparent 0 4px, #3d483f 4px 7px, transparent 7px 15px, #3d483f 15px 18px, transparent 18px),
        #e5cf97;
    }

    .swatch.lamp {
      background:
        radial-gradient(circle at 50% 22%, #ffd96a 0 5px, transparent 6px),
        linear-gradient(90deg, transparent 0 9px, #424a48 9px 13px, transparent 13px),
        #8fca72;
    }

    .swatch.rock {
      background:
        radial-gradient(ellipse at 48% 56%, #8d9690 0 9px, #69736d 10px 12px, transparent 13px),
        #8fca72;
    }

    .swatch.trash {
      background:
        linear-gradient(90deg, transparent 0 6px, #316a68 6px 17px, transparent 17px),
        linear-gradient(#e6d66e 0 4px, transparent 4px),
        #c7c0b1;
    }

    .swatch.sign {
      background:
        linear-gradient(90deg, transparent 0 10px, #3f4945 10px 13px, transparent 13px),
        linear-gradient(transparent 0 4px, #f3f0df 4px 13px, transparent 13px),
        #8fca72;
    }

    .swatch.vending {
      background:
        linear-gradient(90deg, transparent 0 5px, #c94334 5px 17px, #263744 17px 21px, transparent 21px),
        linear-gradient(transparent 0 5px, #f6e16d 5px 10px, transparent 10px),
        #c7c0b1;
    }

    .swatch.supplier,
    .swatch.logistics,
    .swatch.bank,
    .swatch.office,
    .swatch.school,
    .swatch.park-office,
    .swatch.repair,
    .swatch.recycle {
      background:
        linear-gradient(transparent 0 5px, rgba(255, 255, 255, 0.7) 5px 8px, transparent 8px 12px, rgba(255, 255, 255, 0.45) 12px 15px, transparent 15px),
        linear-gradient(90deg, transparent 0 5px, var(--swatch-building, #697d8a) 5px 18px, transparent 18px),
        #c7c0b1;
    }

    .swatch.supplier { --swatch-building: #9b6e57; }
    .swatch.logistics { --swatch-building: #6e8581; }
    .swatch.bank { --swatch-building: #b49458; }
    .swatch.office { --swatch-building: #697d8a; }
    .swatch.school { --swatch-building: #8f785f; }
    .swatch.park-office { --swatch-building: #76806d; }
    .swatch.repair { --swatch-building: #6d7482; }
    .swatch.recycle { --swatch-building: #4f876b; }

    .swatch.erase {
      background:
        linear-gradient(45deg, transparent 0 44%, #bd4d44 44% 56%, transparent 56%),
        #f5eee2;
    }

    .tool-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .control-group {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      display: grid;
      gap: 10px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .range {
      width: 100%;
      accent-color: var(--accent);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .action {
      border: 1px solid #cfc7b4;
      background: #f9f7ef;
      color: var(--ink);
      border-radius: 7px;
      padding: 9px 6px;
      cursor: pointer;
      min-height: 40px;
    }

    .action.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .action:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .toggle input {
      width: 42px;
      height: 22px;
      margin: 0;
      appearance: none;
      border: 1px solid #b9c3b4;
      border-radius: 999px;
      background: #e1ded1;
      position: relative;
      cursor: pointer;
    }

    .toggle input::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      top: 1px;
      left: 1px;
      border-radius: 50%;
      background: #fffdf8;
      box-shadow: 0 1px 4px rgba(33, 49, 44, 0.22);
      transition: transform 140ms ease;
    }

    .toggle input:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .toggle input:checked::before {
      transform: translateX(20px);
    }

    .economy-panel {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .economy-head,
    .metric,
    .stock-row,
    .agent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .economy-head {
      font-weight: 700;
    }

    .action.mini {
      min-height: 32px;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .economy-status {
      min-height: 36px;
      border-left: 3px solid var(--accent);
      padding: 7px 9px;
      background: #eef4ef;
      color: #34433e;
      font-size: 0.86rem;
      line-height: 1.25;
    }

    .economy-grid {
      display: grid;
      gap: 8px;
    }

    .metric,
    .agent-row {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .metric strong,
    .agent-row strong {
      color: var(--ink);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .stock-list,
    .agent-list {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .agent-list {
      max-height: 268px;
      overflow: auto;
      padding-right: 2px;
    }

    .stock-row {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) 36px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .stock-bar {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfdbcf;
    }

    .stock-fill {
      height: 100%;
      width: 50%;
      background: #2f7d62;
      border-radius: inherit;
      transition: width 180ms ease;
    }

    .agent-name {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .agent-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #2f7d62;
    }

    .ai-section {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      display: grid;
      gap: 9px;
      min-width: 0;
    }

    .ai-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 700;
    }

    .ai-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .ai-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .ai-card {
      min-width: 0;
      border: 1px solid #ddd6c6;
      border-radius: 7px;
      background: #f9f7ef;
      padding: 8px;
      display: grid;
      gap: 3px;
    }

    .ai-card span,
    .ai-list li {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.25;
    }

    .ai-card strong {
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .ai-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
      min-width: 0;
    }

    .ai-list li {
      border-left: 3px solid #cfc7b4;
      background: #f9f7ef;
      padding: 6px 8px;
      min-width: 0;
    }

    .ai-list.decisions li {
      border-left-color: var(--accent);
      color: #34433e;
    }

    .reasoning-window {
      border: 1px solid #d8d0bd;
      border-radius: 7px;
      background: #fffdf7;
      display: grid;
      min-width: 0;
      overflow: hidden;
    }

    .reasoning-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 9px;
      border-bottom: 1px solid #e4decf;
      background: #f5f1e6;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .reasoning-head strong {
      color: var(--accent-strong);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .reasoning-log {
      max-height: 220px;
      overflow: auto;
      display: grid;
      gap: 7px;
      padding: 8px;
    }

    .reasoning-step {
      display: grid;
      gap: 3px;
      border-left: 3px solid #b49458;
      background: #f9f7ef;
      padding: 7px 8px;
    }

    .reasoning-step strong {
      color: var(--ink);
      font-size: 0.8rem;
    }

    .reasoning-step span {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.28;
    }

    .sla-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .sla-card {
      min-width: 0;
      border: 1px solid #ddd6c6;
      border-radius: 7px;
      background: #f9f7ef;
      padding: 8px;
      display: grid;
      gap: 3px;
    }

    .sla-card span,
    .audit-item span {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.25;
    }

    .sla-card strong {
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .audit-list {
      display: grid;
      gap: 7px;
      max-height: 230px;
      overflow: auto;
    }

    .audit-item {
      border-left: 3px solid #4f876b;
      background: #f9f7ef;
      padding: 7px 8px;
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .audit-item strong {
      color: var(--ink);
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .environment-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .environment-card {
      min-width: 0;
      border: 1px solid #ddd6c6;
      border-radius: 7px;
      background: #f9f7ef;
      padding: 8px;
      display: grid;
      gap: 3px;
    }

    .environment-card span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .environment-card strong {
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .report-list {
      display: grid;
      gap: 7px;
      max-height: 240px;
      overflow: auto;
    }

    .report-item {
      border-left: 3px solid #697d8a;
      background: #f9f7ef;
      padding: 8px;
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .report-item strong {
      color: var(--ink);
      font-size: 0.82rem;
    }

    .report-item span {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.28;
    }

    .stage-wrap {
      min-width: 0;
      position: relative;
      background:
        linear-gradient(#a9b1b0 0 18px, transparent 18px),
        linear-gradient(90deg, #747b7b 0 10%, #d8d1c2 10% 13%, transparent 13% 87%, #d8d1c2 87% 90%, #747b7b 90%),
        #d5d0c2;
      border: 1px solid #aeb0aa;
      box-shadow: var(--shadow);
      border-radius: 8px;
      padding: 38px 24px 30px;
      display: grid;
      align-content: center;
      justify-items: center;
      overflow: hidden;
    }

    .stage-wrap::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 54px;
      background:
        linear-gradient(90deg,
          #7f897f 0 8%, transparent 8% 10%,
          #9b6e57 10% 18%, transparent 18% 21%,
          #697d8a 21% 30%, transparent 30% 34%,
          #b49458 34% 42%, transparent 42% 47%,
          #76806d 47% 56%, transparent 56% 61%,
          #8f785f 61% 70%, transparent 70% 74%,
          #6e8581 74% 84%, transparent 84% 88%,
          #a26f5a 88% 96%, transparent 96%);
      opacity: 0.65;
      clip-path: polygon(0 42%, 8% 42%, 8% 20%, 18% 20%, 18% 34%, 30% 34%, 30% 12%, 42% 12%, 42% 28%, 56% 28%, 56% 18%, 70% 18%, 70% 38%, 84% 38%, 84% 16%, 96% 16%, 96% 42%, 100% 42%, 100% 100%, 0 100%);
    }

    .stage-wrap::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 24px;
      background:
        repeating-linear-gradient(90deg, transparent 0 24px, rgba(255, 239, 135, 0.7) 24px 46px, transparent 46px 72px),
        var(--asphalt);
    }

    canvas {
      width: 100%;
      max-width: 1216px;
      height: auto;
      aspect-ratio: 38 / 24;
      display: block;
      image-rendering: pixelated;
      border-radius: 6px;
      border: 4px solid var(--curb);
      background: #8fca72;
      box-shadow: 0 10px 22px rgba(38, 43, 41, 0.22);
      touch-action: none;
      cursor: crosshair;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 820px) {
      .app {
        width: min(100vw - 20px, 700px);
        padding-top: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .meta {
        text-align: left;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .tools {
        order: 2;
      }

      .dashboard {
        order: 3;
      }

      .tool-grid,
      .actions {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .tool {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 8px 4px;
      }

      .tool-label {
        font-size: 0.82rem;
        white-space: normal;
        text-align: center;
        line-height: 1.15;
      }
    }

    @media (min-width: 821px) and (max-width: 1280px) {
      .workspace {
        grid-template-columns: 270px minmax(0, 1fr);
      }

      .dashboard {
        grid-column: 1 / -1;
      }

      .dashboard .economy-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .dashboard .stock-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .dashboard .agent-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-height: 190px;
      }
    }

    @media (max-width: 520px) {
      .tool-grid,
      .actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .stage-wrap {
        padding: 7px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>城市微观公园沙盒</h1>
      <div class="meta" id="summary">38 x 24</div>
    </header>

    <section class="workspace" aria-label="城市公园编辑器">
      <aside class="tools" aria-label="工具">
        <div class="tool-grid" id="toolGrid"></div>

        <div class="control-group">
          <div class="control-row">
            <span>笔刷</span>
            <strong id="brushValue">1</strong>
          </div>
          <input class="range" id="brushSize" type="range" min="1" max="4" value="1" aria-label="笔刷大小">
        </div>

        <div class="control-group actions">
          <button class="action" id="undoButton" type="button">撤销</button>
          <button class="action primary" id="randomButton" type="button">随机</button>
          <button class="action" id="clearButton" type="button">清空</button>
          <button class="action" id="fillButton" type="button">铺草</button>
        </div>

        <label class="toggle">
          <span>网格</span>
          <input id="gridToggle" type="checkbox" checked aria-label="显示网格">
        </label>
      </aside>

      <div class="stage-wrap">
        <canvas id="parkCanvas" width="1216" height="768" aria-label="城市微观公园画布"></canvas>
      </div>

      <aside class="dashboard" aria-label="自动贩卖机经济看板">
        <div class="economy-panel">
          <div class="economy-head">
            <span>贩卖机经济</span>
            <button class="action mini" id="economyToggle" type="button">暂停</button>
            <button class="action mini" id="liveModeToggle" type="button" title="对接 Django /api/vending 后端">Live</button>
          </div>
          <div class="economy-status" id="economyStatus">等待自动贩卖机</div>
          <div class="live-config" style="display:none;font-size:0.78rem;color:var(--muted);margin-top:6px;" id="liveConfig">
            <label style="display:flex;gap:6px;align-items:center;">
              <span>sim</span>

          return parsed;
        }
      } catch (error) {
        return createPark();
      }
      return createPark();
    }

    function createAgent(template, index) {
      const point = objectPoint(template.home) || entrancePoint(template.entry);
      return {
        id: `${template.role}-${index}`,
        role: template.role,
        type: template.type,
        color: template.color,
        budget: template.budget + (template.type === "consumer" ? Math.floor(Math.random() * 7) : 0),
        demand: template.demand,
        preference: template.preference,
        home: template.home,
        x: point.x,
        y: point.y,
        target: randomParkPoint(),
        state: template.type === "consumer" ? "闲逛" : "待命",
        wait: Math.random() * 2,
        cooldown: 2 + Math.random() * 5,
        speed: template.type === "consumer" ? 46 + Math.random() * 18 : 58 + Math.random() * 22,
        spent: 0
      };
    }

    function entrancePoint(side) {
      const entrances = {
        west: { x: tile * 1.5, y: canvas.height / 2 },
        east: { x: canvas.width - tile * 1.5, y: canvas.height / 2 },
        north: { x: canvas.width / 2, y: tile * 1.5 },
        south: { x: canvas.width / 2, y: canvas.height - tile * 1.5 }
      };
      return entrances[side] || entrances.west;
    }

    function randomParkPoint() {
      const walkable = [];
      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          const cell = park[row][column];
          if (cell.terrain !== "water") walkable.push({ column, row });
        }
      }
      const choice = walkable[Math.floor(Math.random() * walkable.length)] || { column: 1, row: 1 };
      return cellCenter(choice.column, choice.row);
    }

    function cellCenter(column, row) {
      return {
        x: column * tile + tile / 2,
        y: row * tile + tile / 2
      };
    }

    function findVendingMachines() {
      const machines = [];
      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          if (park[row][column].object === "vending") machines.push({ column, row });
        }
      }
      return machines;
    }

    function vendingPoint() {
      const machine = findVendingMachines()[0];
      if (!machine) return null;
      return cellCenter(machine.column, machine.row);
    }

    function objectPoint(object) {
      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          if (park[row][column].object === object) return cellCenter(column, row);
        }
      }
      return null;
    }

    function agentHomePoint(agent) {
      return objectPoint(agent.home) || randomParkPoint();
    }

    function ensureVendingMachine() {
      if (findVendingMachines().length > 0) return false;
      const candidates = [
        { column: 18, row: 16 },
        { column: 19, row: 16 },
        { column: 18, row: 13 },
        { column: 19, row: 13 }
      ];
      const target = candidates.find(({ column, row }) => park[row]?.[column]?.terrain !== "water") || firstNonWaterCell();
      if (!target) return false;
      park[target.row][target.column].terrain = "plaza";
      park[target.row][target.column].object = "vending";
      return true;
    }

    function firstNonWaterCell() {
      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          if (park[row][column].terrain !== "water") return { column, row };
        }
      }
      return null;
    }

    function resetEconomy(redraw = true, message = "") {
      economy = createEconomy();
      if (message) economy.lastEvent = message;
      agents = createAgents();
      vendingAgent = createVendingAgent();
      environment = createEnvironment();
      if (message) rememberAI(message);
      if (redraw) draw();
    }

    function buildTools() {
      toolGrid.innerHTML = "";
      tools.forEach((tool) => {
        const button = document.createElement("button");
        button.className = `tool${tool.id === currentTool ? " active" : ""}`;
        button.type = "button";
        button.dataset.tool = tool.id;
        button.setAttribute("aria-pressed", String(tool.id === currentTool));
        button.innerHTML = `<span class="swatch ${tool.swatch}" aria-hidden="true"></span><span class="tool-label">${tool.label}</span>`;
        button.addEventListener("click", () => {
          currentTool = tool.id;
          buildTools();
          draw();
        });
        toolGrid.appendChild(button);
      });
    }

    function pushUndo() {
      undoStack.push(clonePark());
      if (undoStack.length > 40) undoStack.shift();
      undoButton.disabled = undoStack.length === 0;
    }

    function getBrushCells(centerColumn, centerRow) {
      const size = Number(brushInput.value);
      const radius = size - 1;
      const cells = [];
      for (let row = centerRow - radius; row <= centerRow + radius; row += 1) {
        for (let column = centerColumn - radius; column <= centerColumn + radius; column += 1) {
          const distance = Math.abs(column - centerColumn) + Math.abs(row - centerRow);
          if (column >= 0 && column < columns && row >= 0 && row < rows && distance <= radius) {
            cells.push({ column, row });
          }
        }
      }
      return cells;
    }

    function paintAt(column, row) {
      const key = `${column}:${row}:${currentTool}:${brushInput.value}`;
      if (key === lastPainted) return;
      lastPainted = key;
      const activeTool = tools.find((item) => item.id === currentTool);

      if (activeTool?.id === "vending") {
        removeVendingMachines();
        const cell = park[row]?.[column];
        if (cell) {
          if (cell.terrain === "water") cell.terrain = "plaza";
          cell.object = "vending";
        }
        savePark();
        draw();
        return;
      }

      getBrushCells(column, row).forEach(({ column: cellColumn, row: cellRow }) => {
        const cell = park[cellRow][cellColumn];

        if (activeTool.kind === "terrain") {
          cell.terrain = activeTool.id;
          if (activeTool.id === "water") cell.object = null;
        }

        if (activeTool.kind === "object") {
          if (buildingObjects.includes(activeTool.id)) cell.terrain = "plaza";
          if (cell.terrain !== "water") cell.object = activeTool.id;
        }

        if (activeTool.kind === "erase") {
          cell.terrain = "grass";
          cell.object = null;
        }
      });

      savePark();
      draw();
    }

    function removeVendingMachines() {
      park.forEach((row) => {
        row.forEach((cell) => {
          if (cell.object === "vending") cell.object = null;
        });
      });
    }

    function pointerToCell(event) {
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * (canvas.width / rect.width);
      const y = (event.clientY - rect.top) * (canvas.height / rect.height);
      return {
        column: Math.floor(x / tile),
        row: Math.floor(y / tile)
      };
    }

    function drawPixelRect(x, y, width, height, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(width), Math.round(height));
    }

    function drawTerrain(cell, x, y, column, row) {
      drawPixelRect(x, y, tile, tile, terrainColors[cell.terrain]);

      if (cell.terrain === "grass") {
        const fleck = (column * 11 + row * 17) % 5;
        if (fleck < 3) {
          ctx.fillStyle = fleck === 0 ? "rgba(54, 123, 67, 0.28)" : "rgba(235, 244, 183, 0.32)";
          ctx.fillRect(x + 7 + fleck * 4, y + 6 + ((column + row) % 4) * 5, 2, 5);
          ctx.fillRect(x + 11 + fleck * 3, y + 12 + ((column * 2 + row) % 3) * 4, 2, 4);
        }
      }

      if (cell.terrain === "path") {
        ctx.fillStyle = "rgba(127, 95, 52, 0.18)";
        ctx.fillRect(x + 4, y + 7, 7, 3);
        ctx.fillRect(x + 18, y + 16, 8, 3);
        ctx.fillRect(x + 10, y + 24, 5, 2);
      }

      if (cell.terrain === "plaza") {
        ctx.strokeStyle = "rgba(75, 78, 74, 0.22)";
        ctx.lineWidth = 1;
        for (let offset = 8; offset < tile; offset += 8) {
          ctx.beginPath();
          ctx.moveTo(x + offset + 0.5, y);
          ctx.lineTo(x + offset + 0.5, y + tile);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x, y + offset + 0.5);
          ctx.lineTo(x + tile, y + offset + 0.5);
          ctx.stroke();
        }
        if ((column + row) % 2 === 0) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
          ctx.fillRect(x + 2, y + 2, 12, 2);
        }
      }

      if (cell.terrain === "water") {
        ctx.fillStyle = "rgba(222, 250, 255, 0.5)";
        ctx.fillRect(x + 5, y + 9, 10, 3);
        ctx.fillRect(x + 15, y + 20, 12, 3);
        ctx.fillStyle = "rgba(26, 91, 130, 0.14)";
        ctx.fillRect(x, y + tile - 5, tile, 5);
      }
    }

    function drawObject(type, x, y, column, row) {
      if (buildingStyles[type]) {
        drawBuilding(type, x, y);
        return;
      }

      if (type === "tree") {
        drawPixelRect(x + 14, y + 15, 5, 12, "#8a5b38");
        drawPixelRect(x + 9, y + 9, 14, 12, "#2f8a4d");
        drawPixelRect(x + 6, y + 13, 20, 9, "#276d42");
        drawPixelRect(x + 12, y + 5, 11, 8, "#3d9b57");
        drawPixelRect(x + 22, y + 15, 4, 4, "#245f3b");
      }

      if (type === "flower") {
        const palette = ["#e34f71", "#f1844e", "#f0cf45", "#7c5bb2"];
        for (let i = 0; i < 4; i += 1) {
          const px = x + 7 + ((i * 7 + column * 3) % 18);
          const py = y + 8 + ((i * 5 + row * 4) % 16);
          drawPixelRect(px, py + 5, 2, 7, "#3f8a48");
          drawPixelRect(px - 2, py + 2, 6, 5, palette[(i + column + row) % palette.length]);
          drawPixelRect(px, py + 4, 2, 2, "#ffe179");
        }
      }

      if (type === "bench") {
        drawPixelRect(x + 6, y + 10, 20, 5, "#8a5432");
        drawPixelRect(x + 5, y + 18, 22, 5, "#9b6038");
        drawPixelRect(x + 8, y + 23, 3, 6, "#3f4945");
        drawPixelRect(x + 22, y + 23, 3, 6, "#3f4945");
        drawPixelRect(x + 4, y + 16, 24, 2, "#5f3a25");
      }

      if (type === "lamp") {
        drawPixelRect(x + 15, y + 9, 3, 18, "#384543");
        drawPixelRect(x + 11, y + 5, 11, 8, "#ffd96a");
        drawPixelRect(x + 12, y + 6, 9, 6, "rgba(255, 246, 170, 0.78)");
        drawPixelRect(x + 10, y + 27, 13, 3, "#384543");
      }

      if (type === "rock") {
        drawPixelRect(x + 8, y + 17, 17, 8, "#737d78");
        drawPixelRect(x + 11, y + 13, 12, 8, "#8f9892");
        drawPixelRect(x + 16, y + 15, 7, 5, "#aab0aa");
        drawPixelRect(x + 7, y + 23, 20, 3, "rgba(42, 52, 48, 0.14)");
      }

      if (type === "trash") {
        drawPixelRect(x + 10, y + 9, 13, 3, "#e7d769");
        drawPixelRect(x + 11, y + 12, 11, 15, "#2f6f6b");
        drawPixelRect(x + 13, y + 15, 7, 9, "#3b8881");
        drawPixelRect(x + 9, y + 27, 15, 3, "rgba(42, 52, 48, 0.16)");
      }

      if (type === "sign") {
        drawPixelRect(x + 15, y + 12, 3, 17, "#3f4945");
        drawPixelRect(x + 8, y + 7, 18, 10, "#f3f0df");
        drawPixelRect(x + 10, y + 9, 10, 2, "#2f7d62");
        drawPixelRect(x + 10, y + 13, 13, 2, "#61706b");
        drawPixelRect(x + 11, y + 29, 13, 2, "rgba(42, 52, 48, 0.16)");
      }

      if (type === "vending") {
        drawPixelRect(x + 7, y + 3, 18, 27, "#b9352e");
        drawPixelRect(x + 9, y + 5, 10, 11, "#f4e8c4");
        drawPixelRect(x + 20, y + 6, 3, 18, "#263744");
        drawPixelRect(x + 10, y + 8, 3, 5, "#58a7d3");
        drawPixelRect(x + 14, y + 8, 3, 5, "#7ab45d");
        drawPixelRect(x + 9, y + 18, 10, 4, "#2b2f32");
        drawPixelRect(x + 21, y + 10, 1, 2, "#f6e16d");
        drawPixelRect(x + 5, y + 30, 22, 2, "rgba(42, 52, 48, 0.18)");
      }
    }

    function drawBuilding(type, x, y) {
      const style = buildingStyles[type];
      drawPixelRect(x + 3, y + 7, 26, 22, style.color);
      drawPixelRect(x + 2, y + 4, 28, 5, style.roof);
      drawPixelRect(x + 7, y + 12, 5, 5, "rgba(244, 239, 217, 0.78)");
      drawPixelRect(x + 14, y + 12, 5, 5, "rgba(244, 239, 217, 0.62)");
      drawPixelRect(x + 21, y + 12, 4, 5, "rgba(244, 239, 217, 0.7)");
      drawPixelRect(x + 14, y + 21, 6, 8, "#343d3a");
      drawPixelRect(x + 2, y + 29, 28, 3, "rgba(42, 52, 48, 0.15)");
      ctx.fillStyle = "#fffdf0";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(style.label, x + 16, y + 19);
    }

    function drawGrid() {
      if (!showGrid) return;
      ctx.strokeStyle = "rgba(45, 64, 54, 0.16)";
      ctx.lineWidth = 1;
      for (let column = 0; column <= columns; column += 1) {
        ctx.beginPath();
        ctx.moveTo(column * tile + 0.5, 0);
        ctx.lineTo(column * tile + 0.5, canvas.height);
        ctx.stroke();
      }
      for (let row = 0; row <= rows; row += 1) {
        ctx.beginPath();
        ctx.moveTo(0, row * tile + 0.5);
        ctx.lineTo(canvas.width, row * tile + 0.5);
        ctx.stroke();
      }
    }

    function drawAgents() {
      agents.forEach((agent) => {
        drawPixelRect(agent.x - 5, agent.y - 2, 10, 9, "rgba(33, 49, 44, 0.15)");
        drawPixelRect(agent.x - 4, agent.y - 8, 8, 10, agent.color);
        drawPixelRect(agent.x - 3, agent.y - 12, 6, 5, "#f0c49b");
        drawPixelRect(agent.x - 6, agent.y + 1, 4, 5, "#263744");
        drawPixelRect(agent.x + 2, agent.y + 1, 4, 5, "#263744");
        if (agent.type !== "consumer") {
          drawPixelRect(agent.x + 5, agent.y - 7, 5, 6, "#e7d769");
        }
        if (agent.state.startsWith("买了")) {
          drawPixelRect(agent.x + 5, agent.y - 14, 8, 7, "#fff8c9");
          drawPixelRect(agent.x + 7, agent.y - 12, 4, 3, "#2f7d62");
        }
      });
    }

    function drawVendingEconomySignal() {
      const point = vendingPoint();
      if (!point) return;
      const pulse = 4 + Math.sin(performance.now() / 220) * 2;
      ctx.strokeStyle = "rgba(47, 125, 98, 0.42)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(point.x, point.y, tile * 1.15 + pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawEnvironmentOverlay() {
      const weather = weatherInfo();
      const hour = environment.hour;
      const night = hour < 6 || hour >= 20;
      ctx.fillStyle = weather.color;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (night) {
        ctx.fillStyle = "rgba(20, 34, 48, 0.22)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (environment.weather === "rain") {
        ctx.strokeStyle = "rgba(226, 241, 255, 0.45)";
        ctx.lineWidth = 2;
        const shift = Math.floor(performance.now() / 80) % 28;
        for (let x = -20; x < canvas.width; x += 34) {
          ctx.beginPath();
          ctx.moveTo(x + shift, 0);
          ctx.lineTo(x + shift + 16, 28);
          ctx.stroke();
        }
      }

      if (environment.weather === "heat") {
        ctx.fillStyle = "rgba(255, 245, 160, 0.09)";
        for (let x = 0; x < canvas.width; x += 96) {
          ctx.fillRect(x, 0, 34, canvas.height);
        }
      }
    }

    function drawBrushPreview() {
      const activeTool = tools.find((tool) => tool.id === currentTool);
      document.body.style.setProperty("--active-tool", activeTool?.label || "");
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          drawTerrain(park[row][column], column * tile, row * tile, column, row);
        }
      }

      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          const cell = park[row][column];
          if (cell.object) drawObject(cell.object, column * tile, row * tile, column, row);
        }
      }

      drawGrid();
      drawVendingEconomySignal();
      drawAgents();
      drawEnvironmentOverlay();
      drawBrushPreview();
      updateSummary();
      renderEconomyPanel();
      undoButton.disabled = undoStack.length === 0;
    }

    function updateSummary() {
      const counts = {
        tree: 0,
        flower: 0,
        bench: 0,
        lamp: 0,
        rock: 0,
        trash: 0,
        sign: 0,
        vending: 0,
        water: 0,
        path: 0,
        plaza: 0
      };
      park.flat().forEach((cell) => {
        if (cell.object && Object.hasOwn(counts, cell.object)) counts[cell.object] += 1;
        if (cell.terrain === "water") counts.water += 1;
        if (cell.terrain === "path") counts.path += 1;
        if (cell.terrain === "plaza") counts.plaza += 1;
      });
      summary.textContent = `贩卖机 ${counts.vending} · 收入 ¥${economy.revenue.toFixed(0)} · 成交 ${economy.sales}`;
    }

    function renderEconomyPanel(force = false) {
      const now = performance.now();
      if (!force && now - lastEconomyUiUpdate < 240) return;
      lastEconomyUiUpdate = now;

      const machineCount = findVendingMachines().length;
      economyStatus.textContent = machineCount > 0
        ? economy.lastEvent
        : "交易暂停：缺少自动贩卖机。";
      simClockValue.textContent = formatSimTime();
      environmentGrid.innerHTML = [
        ["天气", weatherInfo().label],
        ["季节", seasonInfo().label],
        ["日历", environment.holiday],
        ["客流", environment.trafficIndex.toFixed(2)],
        ["需求", environment.demandIndex.toFixed(2)],
        ["仿真日", `D${environment.day}`],
        ["办公", isBusinessOpen("office") ? "营业" : "下班"],
        ["银行", isBusinessOpen("bank") ? "营业" : "关闭"],
        ["今日波动", `${Math.round(environment.dailyTrafficVariance * 100)}%`],

        <div class="environment-card">
          <span>${label}</span>
          <strong>${value}</strong>
        </div>

      profitValue.textContent = `¥${(economy.revenue - economy.costs).toFixed(2)}`;
      operatorCashValue.textContent = `¥${economy.operatorCash.toFixed(2)}`;
      loanValue.textContent = `¥${economy.loans.toFixed(2)}`;
